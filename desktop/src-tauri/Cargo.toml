[package]
name = "ya-desktop"
version = "0.1.1"
description = "Ya Korean voice approval desk companion"
authors = ["Ya"]
edition = "2021"
rust-version = "1.77.2"
publish = false
default-run = "ya-desktop"

[lib]
name = "ya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "ya-worker"
path = "src/bin/ya-worker.rs"

[dependencies]
atomicwrites = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
sha2 = "0.10"
# Plain HTTP only (no TLS feature): the worker talks to a model runner on loopback.
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
