[package]
name = "blackhole-desktop"
version = "0.2.0"
description = "Blackhole Korean voice approval desk companion"
authors = ["Blackhole"]
edition = "2021"
rust-version = "1.77.2"
publish = false
default-run = "blackhole-desktop"

[lib]
name = "blackhole_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "blackhole-worker"
path = "src/bin/blackhole-worker.rs"

[dependencies]
atomicwrites = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
sha2 = "0.10"
# The model runner is loopback-only (checked in code); TLS is for the optional Discord/Slack input.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }

[dev-dependencies]
tempfile = "3"
