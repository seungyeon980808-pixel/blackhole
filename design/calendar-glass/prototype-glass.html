<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블랙홀 시안</title>
<style>
:root{
  --font:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  --ink:#f4f5fb;--ink2:rgba(244,245,251,.7);--ink3:rgba(244,245,251,.42);
  --glass:rgba(255,255,255,.1);--glass2:rgba(255,255,255,.18);--line:rgba(255,255,255,.24);--hair:rgba(255,255,255,.1);
  --school:#6fd3ff;--personal:#ff9ad8;--todo:#ffd36e;--note:#b8f08a;--now:#ff6b8a;--warn:rgba(244,245,251,.6);
  --page:#0b0c18;--wall:radial-gradient(900px 650px at 0% 0%,#4b37c4 0%,transparent 60%),radial-gradient(800px 650px at 100% 100%,#0f86a6 0%,transparent 60%),radial-gradient(600px 500px at 60% 40%,#b0347f55 0%,transparent 60%),#0d0f20;
  --tday:#fff;--tdayink:#111;
}
:root[data-theme="light"]{
  --ink:#16172a;--ink2:rgba(22,23,42,.68);--ink3:rgba(22,23,42,.42);
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.88);--line:rgba(22,23,42,.12);--hair:rgba(22,23,42,.07);
  --school:#1689c9;--personal:#c9479a;--todo:#b98000;--note:#3f8a12;--now:#e0304f;--warn:rgba(22,23,42,.55);
  --page:#e8eaf3;--wall:radial-gradient(900px 650px at 0% 0%,#d4caff 0%,transparent 60%),radial-gradient(800px 650px at 100% 100%,#bfeef7 0%,transparent 60%),radial-gradient(600px 500px at 60% 40%,#ffd3ec 0%,transparent 60%),#f1f2f8;
  --tday:#16172a;--tdayink:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.g{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 30px rgba(0,0,0,.18);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-radius:14px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px}
.ctl .name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-right:auto}
.ctl .name svg{width:26px;height:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;color:var(--ink2);font-size:12.5px}
.seg button.on{background:var(--glass2);color:var(--ink);font-weight:700}
.demo{font-size:12px;color:var(--ink2);display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--ink2)}
.demo b{color:var(--ink);font-size:13px;margin:0 4px}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:4px 20px 30px;flex-wrap:wrap}
/* desktop */
.win{width:1180px;height:760px;border-radius:14px;overflow:hidden;background:var(--wall);box-shadow:0 24px 70px rgba(0,0,0,.35);display:grid;grid-template-rows:30px auto 1fr auto;flex:none;position:relative}
.chrome{display:flex;align-items:center;gap:7px;padding:0 12px}
.chrome i{width:11px;height:11px;border-radius:50%}
.bar{display:flex;align-items:center;gap:6px;padding:4px 12px 8px}
.bar .title{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-right:6px;min-width:150px}
.nb{border:1px solid var(--line);background:var(--glass);border-radius:7px;padding:3px 9px;font-size:12.5px}
.sp{flex:1}
.content{min-height:0;padding:0 12px;overflow:hidden}
.composer{padding:6px 12px 10px}
.log{display:flex;flex-direction:column;gap:2px;margin-bottom:5px;max-height:52px;overflow:auto}
.lg{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.lg b{color:var(--ink);font-weight:700}
.lg .src{color:var(--ink3);font-size:11px}
.lg a{color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:11.5px}
.lg.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(255,255,255,.18)}100%{background:transparent}}
.inp{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 4px 4px 12px}
.inp input{flex:1;background:none;border:0;outline:0;font-size:14px;padding:7px 0;min-width:0}
.inp input::placeholder{color:var(--ink3)}
.inp button{border:0;border-radius:9px;padding:7px 11px;font-size:12.5px;background:var(--glass2)}
.inp button.go{background:linear-gradient(135deg,#7c5cff,#4fb3ff);color:#fff;font-weight:700}
/* marks */
.c{display:block;font-size:11px;line-height:15px;padding:0 4px;border-radius:4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.c.school{background:color-mix(in srgb,var(--school) 26%,transparent)}
.c.personal{background:color-mix(in srgb,var(--personal) 26%,transparent)}
.c.task{background:none;color:var(--ink);padding-left:1px}
.c.task.done{text-decoration:line-through;opacity:.45}
.c.prov{outline:1px dashed var(--ink3);outline-offset:-1px}
.pb{display:block;font-size:10.5px;line-height:14px;height:14px;margin:1px -4px 0;padding:0 6px;white-space:nowrap;overflow:hidden;font-weight:700}
.pb.school{background:color-mix(in srgb,var(--school) 34%,transparent)}
.pb.personal{background:color-mix(in srgb,var(--personal) 34%,transparent)}
.pb.st{border-top-left-radius:7px;border-bottom-left-radius:7px;margin-left:0}
.pb.en{border-top-right-radius:7px;border-bottom-right-radius:7px;margin-right:0}
.ga{font-size:9px;font-weight:800;padding:0 3px;border-radius:3px;background:var(--ink);color:var(--page);margin-left:3px;vertical-align:1px}
.dd{font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap}
.dd.hot{color:var(--now)}
.dd.soon{color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d-school{background:var(--school)}.d-personal{background:var(--personal)}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:20px repeat(6,minmax(0,1fr));height:100%;border-radius:10px;overflow:hidden}
.month .dw{font-size:11px;color:var(--ink2);padding:2px 5px}
.month .cell{border-top:1px solid var(--hair);border-left:1px solid var(--hair);padding:2px 4px;overflow:hidden;cursor:pointer;min-height:0}
.month .cell:nth-child(7n+1){border-left:0}
.month .cell.out{opacity:.35}
.month .n{font-size:11.5px;font-weight:700;padding:0 4px;border-radius:5px}
.month .cell.today .n{background:var(--tday);color:var(--tdayink)}
.month .sun .n{color:#ff7d8f}.month .cell.today.sun .n{color:var(--tdayink)}
.month .more{font-size:10px;color:var(--ink3);padding-left:3px}
/* week */
.week{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr));height:100%;overflow:auto;border-radius:10px;align-content:start}
.week .hd{font-size:11.5px;text-align:center;padding:3px 0;color:var(--ink2);cursor:pointer;position:sticky;top:0;background:var(--page);z-index:2}
.week .hd.today b{background:var(--tday);color:var(--tdayink);border-radius:5px;padding:0 5px}
.week .hl{font-size:10px;color:var(--ink3);text-align:right;padding-right:4px}
.week .col{position:relative;border-left:1px solid var(--hair)}
.week .td{border-left:1px solid var(--hair);padding:1px 2px 3px;border-bottom:1px solid var(--hair)}
.week .per{grid-column:2 / span 7;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;padding:2px 0 3px;border-bottom:1px solid var(--hair)}
.week .per .pbw{font-size:11px;font-weight:700;padding:1px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}
.wb{position:absolute;left:2px;right:2px;border-radius:4px;font-size:10.5px;line-height:13px;padding:1px 4px;overflow:hidden;cursor:pointer}
.wb.school{background:color-mix(in srgb,var(--school) 30%,transparent)}
.wb.personal{background:color-mix(in srgb,var(--personal) 30%,transparent)}
.wb.prov{outline:1px dashed var(--ink2);outline-offset:-1px}
.bell{position:absolute;left:2px;right:2px;height:0;border-top:1px dashed var(--ink3);z-index:2}
.bell span{position:absolute;right:2px;top:-7px;font-size:9px;color:var(--ink3);background:var(--page);padding:0 2px}
/* 10-minute timetable */
.tt{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass)}
.tt .mh0{border-bottom:1px solid var(--line)}
.tt .mh{font-size:9.5px;color:var(--ink3);text-align:right;padding:2px 3px 1px;border-bottom:1px solid var(--line)}
.tt .h{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.tt .row{grid-column:2 / span 6;position:relative;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr)}
.tt .row i{border-left:1px solid var(--line)}
.tt .row i:first-child{border-left:0}
.tt .row i:nth-child(4){border-left:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.tt .bk{position:absolute;top:1px;bottom:1px;border-radius:3px;font-size:10.5px;line-height:1.15;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center}
.tt .bk.school{background:color-mix(in srgb,var(--school) 42%,transparent)}
.tt .bk.personal{background:color-mix(in srgb,var(--personal) 30%,transparent)}
.tt .bk.prov{outline:1px dashed var(--ink);outline-offset:-1px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.tt .bk.half{bottom:50%}.tt .bk.half2{top:50%}
.tt .now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:3}
.tt .rm{position:absolute;top:3px;bottom:3px;width:0;border-left:1px dashed var(--ink3);z-index:2}
.tt .row.past{opacity:.5}
/* day */
.day{display:grid;grid-template-columns:440px minmax(0,1.2fr) minmax(0,1fr);gap:10px;height:100%;min-height:0}
.col2{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.box{border-radius:10px;padding:7px 10px}
.box>h4{font-size:12px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;letter-spacing:-.2px}
.box>h4 small{font-weight:400;color:var(--ink2);font-size:11px}
.grp{font-size:11px;font-weight:600;color:var(--ink3);margin:10px 0 2px}
.grp:first-of-type{margin-top:0}
.task{padding:4px 0}
.task:last-child{border-bottom:0}
.th{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.bx{width:15px;height:15px;border:1.5px solid var(--ink2);border-radius:4px;flex:none;display:grid;place-items:center;font-size:10px;line-height:1;cursor:pointer}
.done>.bx,.task.done .th .bx{background:var(--note);border-color:var(--note);color:var(--page)}
.task.done .th .t{text-decoration:line-through;color:var(--ink3)}
.tm2{font-size:11px;color:var(--ink3);margin:1px 0 0 23px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog{display:none}
.prog i{display:block;height:100%;background:var(--note)}
.subs{margin:2px 0 0 23px}
.sub{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 0;cursor:pointer}
.sub .bx{width:13px;height:13px}
.sub.done .bx{background:var(--note);border-color:var(--note);color:var(--page)}
.sub.done span:last-child{text-decoration:line-through;color:var(--ink3)}
.subadd{border:0;background:none;outline:0;font-size:12px;color:var(--ink2);padding:2px 0;width:100%;display:none}
.task:hover .subadd,.subadd:focus{display:block}
.subadd::placeholder{color:var(--ink3)}
.ev{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:12.5px;border-top:1px solid var(--hair);cursor:pointer}
.ev:first-of-type{border-top:0}
.ev .tm{width:72px;color:var(--ink2);font-size:11.5px;flex:none;white-space:nowrap}
.ev .act{margin-left:auto;display:flex;gap:4px}
.mini{font-size:11px;border:1px solid var(--line);background:var(--glass2);border-radius:6px;padding:1px 7px}
.prow{padding:3px 0;border-top:1px solid var(--hair);font-size:12.5px}
.prow:first-of-type{border-top:0}
.prow .pbar{height:2px;border-radius:1px;background:var(--hair);margin-top:3px;overflow:hidden}
.prow .pbar i{display:block;height:100%}
.inb{display:flex;gap:7px;font-size:12px;padding:2px 0;border-top:1px solid var(--hair);white-space:nowrap;overflow:hidden}
.inb:first-of-type{border-top:0}
.inb .tm{color:var(--ink3);width:36px;flex:none}
.inb .s{color:var(--ink3);font-size:11px}
.st{font-size:10.5px;width:44px;flex:none}.st.ok{color:var(--note)}.st.run{color:var(--school)}.st.warn{color:var(--todo)}
/* notifications */
.nstack{position:absolute;top:36px;right:12px;width:330px;display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.nt{pointer-events:auto;border-radius:14px;padding:9px 11px;background:color-mix(in srgb,var(--page) 94%,transparent);border:1px solid var(--line);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:slide .35s ease}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.nt .nh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.nt .nh svg{width:16px;height:16px}
.nt b{display:block;font-size:13.5px;margin-top:2px}
.nt .nb2{font-size:12px;color:var(--ink2)}
.nt .na{display:flex;gap:6px;margin-top:6px}
/* phone */
.phone{width:380px;height:820px;border-radius:50px;padding:11px;background:#08080b;box-shadow:0 24px 70px rgba(0,0,0,.45);flex:none}
.scr{width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--wall);display:flex;flex-direction:column;position:relative}
.sb{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700}
.isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#000;z-index:4}
.ph{flex:1;min-height:0;display:flex;flex-direction:column}
.phbar{display:flex;align-items:center;gap:6px;padding:2px 12px 6px}
.phbar .title{font-size:18px;font-weight:800;flex:1}
.phbody{flex:1;overflow:auto;padding:0 10px 6px;min-height:0;display:flex;flex-direction:column;gap:8px}
.phone .tt{grid-template-columns:24px repeat(6,minmax(0,1fr))}
.phone .tt .h{font-size:10px}
.phone .month .c{font-size:9px;line-height:12px;padding:0 2px}
.phone .month .pb{font-size:8.5px;line-height:11px;height:11px}
.phone .month .n{font-size:10.5px}
.phone .composer{padding:4px 10px 4px}
.phone .nstack{top:44px;left:8px;right:8px;width:auto}
.tabs{display:flex;justify-content:space-around;padding:4px 8px 16px;flex:none;border-top:1px solid var(--hair)}
.tabs button{background:none;border:0;font-size:12.5px;color:var(--ink3);padding:6px 8px;font-weight:700}
.tabs button.on{color:var(--ink)}
.lock{flex:1;display:flex;flex-direction:column;padding:0 12px 12px;gap:7px;background:radial-gradient(260px 300px at 25% 25%,rgba(255,170,110,.45),transparent 70%),radial-gradient(300px 300px at 85% 70%,rgba(110,190,255,.45),transparent 70%),linear-gradient(#1a1d3a,#33203f);color:#fff;overflow:auto}
.lock .date{text-align:center;font-size:14px;font-weight:600}
.lock .clock{text-align:center;font-size:70px;font-weight:300;letter-spacing:-3px;line-height:.95}
.lp{border-radius:16px;padding:8px 11px;background:rgba(10,10,20,.32);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.lp h5{font-size:11.5px;font-weight:800;margin-bottom:2px;display:flex;justify-content:space-between}
.lp h5 small{font-weight:400;opacity:.75}
.lr{display:flex;gap:8px;align-items:center;font-size:14px;padding:1.5px 0;white-space:nowrap;overflow:hidden}
.lr .tm{width:42px;font-size:12px;opacity:.75;flex:none}
.lr.past{opacity:.45}
.lr .dd{color:rgba(255,255,255,.6)}.lr .dd.hot{color:#ff8a8a}
.ln{border-radius:16px;padding:8px 10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ln .row{display:flex;gap:6px;align-items:center}
.ln input{flex:1;min-width:0;border:0;outline:0;background:rgba(255,255,255,.18);border-radius:9px;padding:7px 9px;color:#fff;font-size:13px}
.ln input::placeholder{color:rgba(255,255,255,.65)}
.ln button{border:0;border-radius:9px;padding:7px 9px;font-size:12px;background:rgba(255,255,255,.25);color:#fff}
.cap{font-size:10.5px;text-align:center;opacity:.7;line-height:1.5}
.home{flex:1;padding:4px 12px;display:flex;flex-direction:column;gap:9px;overflow:auto;background:linear-gradient(160deg,#3a2f7a,#14506a 55%,#6a2a58);color:#fff}
.wg{border-radius:20px;padding:10px 12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.wg h5{font-size:11.5px;font-weight:800;margin-bottom:3px;display:flex;justify-content:space-between}
.wg h5 small{font-weight:400;opacity:.75}
.w2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.wr{display:flex;gap:8px;font-size:11.5px;padding:2px 0;border-top:1px solid rgba(255,255,255,.07)}
.wr:first-of-type{border-top:0}
.wr.on{font-weight:700}
.wr .wd{width:34px;flex:none;opacity:.8}
.wr .wl{display:flex;flex-wrap:wrap;gap:2px 9px;min-width:0}
.wi{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.wi .dot{width:5px;height:5px}
/* print */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:50}
.modal.on{display:flex}
.sheet{width:794px;min-height:1123px;background:#fff;color:#111;padding:36px 40px;font-family:var(--font);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sheet h1{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:6px}
.sheet h1 small{font-size:11.5px;font-weight:400;color:#555}
.sheet .pper{font-size:11.5px;color:#333;margin-bottom:10px}
.sheet .cols{display:grid;grid-template-columns:380px 1fr;gap:20px}
.sheet .ptt{display:grid;grid-template-columns:26px repeat(6,1fr);border:1px solid #111}
.sheet .ptt .h{font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border-top:1px solid #bbb;height:28px;border-right:1px solid #bbb}
.sheet .ptt .row{grid-column:2 / span 6;position:relative;border-top:1px solid #bbb;display:grid;grid-template-columns:repeat(6,1fr);height:28px}
.sheet .ptt .row i{border-left:1px dotted #bbb}.sheet .ptt .row i:first-child{border-left:0}.sheet .ptt .row i:nth-child(4){border-left:1px solid #888}
.sheet .ptt .first{border-top:0}
.sheet .ptt .bk{position:absolute;top:2px;bottom:2px;background:#e4e4e4;border:1px solid #777;border-radius:2px;font-size:10px;padding:0 3px;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.sheet h3{font-size:12.5px;margin:0 0 4px;border-bottom:1px solid #111;padding-bottom:3px}
.sheet .pck{display:flex;gap:7px;align-items:center;font-size:12.5px;min-height:26px;border-bottom:1px solid #ddd}
.sheet .pck .bx{width:13px;height:13px;border:1.5px solid #111;flex:none;font-size:10px;line-height:11px;text-align:center}
.sheet .pck.sub{padding-left:20px;font-size:12px;min-height:22px}
.sheet .pck small{margin-left:auto;color:#555;font-size:10.5px}
.sheet .line{height:26px;border-bottom:1px solid #ddd}
.sheet .pmonth{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #111}
.sheet .pmonth div{border:1px solid #ccc;min-height:150px;padding:3px;font-size:10px}
.sheet .pmonth .dw{min-height:auto;font-weight:700;text-align:center}
.mbar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
@media print{

/* composer: pull-up handle, icon buttons, chat sheet */
.composer{position:relative}
.grab{display:flex;justify-content:center;padding:0 0 6px;cursor:grab;touch-action:none}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--ink3)}
.last{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 4px 5px;min-height:16px}
.last b{color:var(--ink)}
.last a{color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:11.5px;margin-left:4px}
.ic{width:38px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:var(--glass2);color:var(--ink);padding:0!important}

.chatsheet{position:absolute;left:0;right:0;bottom:0;height:76%;z-index:30;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:color-mix(in srgb,var(--page) 62%,transparent);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--line);box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.chatsheet.open{transform:none}
.chatsheet .grab{padding:9px 0 4px}
.sheethead{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding-bottom:6px}
.thread{flex:1;overflow:auto;padding:4px 18px 8px;display:flex;flex-direction:column;gap:7px;min-height:0}
.bub{max-width:76%;padding:8px 12px;border-radius:16px;font-size:13.5px;line-height:1.45;word-break:keep-all}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#7c5cff,#4f8dff);color:#fff;border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bsrc{font-size:10.5px;color:var(--ink3);margin-top:-4px}
.bsrc.me{align-self:flex-end}.bsrc.ai{align-self:flex-start}
.daysep{align-self:center;font-size:11px;color:var(--ink3);margin:4px 0}
.rc{margin-top:6px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12.5px}
.rc.gone{opacity:.45;text-decoration:line-through}
.rc .rm2{font-size:11.5px;color:var(--ink2)}
.rc .ra{display:flex;gap:5px;margin-top:5px}
.bub .photo{background:#fffdf6;color:#333;border-radius:8px;padding:8px;font-size:11px;line-height:1.5;transform:rotate(-1.5deg)}
.bub .voice{font-size:12px;opacity:.85}
.chatsheet .inp{margin:6px 14px 14px}
.phone .chatsheet{height:88%}
/* alarm: full screen, rings and shakes until answered */
.alarm{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(124,92,255,.6),rgba(8,8,22,.94) 70%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.alarm.on{display:flex}
.al-in{text-align:center;color:#fff;padding:20px}
.al-kind{font-size:13px;opacity:.8;margin-bottom:22px}
.al-ring{width:92px;height:92px;margin:0 auto 20px;position:relative}
.al-ring svg{width:92px;height:92px;border-radius:22px;position:relative;z-index:2}
.al-ring:before,.al-ring:after{content:"";position:absolute;inset:-8px;border-radius:30px;border:2px solid rgba(255,255,255,.7);animation:ping 1.3s infinite}
.al-ring:after{animation-delay:.65s}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.al-title{font-size:30px;font-weight:800;margin:4px 0;letter-spacing:-.5px}
.al-body{font-size:14px;opacity:.85}
.al-btns{display:flex;gap:56px;justify-content:center;margin-top:44px}
.al-btns>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px}
.al-b{width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff}
.al-b.ok{background:#2fd17a}
.al-hint{font-size:11.5px;opacity:.6;margin-top:26px}
.buzz{animation:buzz 1.1s infinite}
@keyframes buzz{0%,45%,100%{transform:translate(0,0)}4%,12%,20%,28%,36%{transform:translate(-3px,0) rotate(-.5deg)}8%,16%,24%,32%,40%{transform:translate(3px,0) rotate(.5deg)}}

<script>
/* ===== time ===== */
const DAY0=new Date(2026,9,25);let nowM=14*60+10;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const DOW="일월화수목금토",TODAY=ymd(DAY0);
const mins=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fd=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
/* ===== data =====
   ev   = timed appointment  {date,s,e,t,a,p,rem}
   task = to-do with deadline, reminder and sub-checklist {due,dueT,t,a,done,rem:[{date,time}],subs:[{t,done}]}
   per  = period over days   {from,to,t,a}                                                            */
let uid=1;
const EV=[],TASK=[],PER=[];
const ev=(date,s,e,t,a,x={})=>EV.push({id:uid++,date,s,e,t,a,...x});
const task=(due,dueT,t,a,x={})=>TASK.push({id:uid++,due,dueT,t,a,done:false,rem:[],subs:[],...x});
const per=(from,to,t,a)=>PER.push({id:uid++,from,to,t,a});

ev("2026-10-25","11:00","11:35","주간 계획 세우기","personal");
ev("2026-10-25","15:30","16:25","안과 진료","personal",{p:true,src:"잠금화면 음성",rem:"15:00"});
ev("2026-10-25","18:30","20:00","가족 저녁","personal",{rem:"18:00"});
ev("2026-10-26","08:30","08:50","운동장 조회","school",{rem:"08:20"});

ev("2026-10-30","18:00","20:00","가족 외식","personal");
ev("2026-10-31","18:00","20:00","친구 결혼식","personal");
ev("2026-10-21","16:00","17:00","교과 협의회","school");ev("2026-10-23","10:00","11:00","치과","personal");
ev("2026-10-15","09:00","10:00","수학여행 회의","school");ev("2026-10-08","19:00","21:00","동창 모임","personal");
ev("2026-10-12","14:00","15:00","시험 감독","school");ev("2026-10-19","13:00","14:00","미용실","personal");
ev("2026-10-20","16:00","17:00","교직원 연수","school");ev("2026-10-06","10:00","11:00","중간고사 회의","school");
ev("2026-11-07","09:00","15:00","현장체험학습","school");
task("2026-10-25","17:00","출석부 정리","school",{rem:[{date:"2026-10-25",time:"16:30"}],src:"음성"});
task("2026-10-25",null,"택배 반품 신청","personal",{done:true});
task("2026-10-26","08:00","공개수업 자료 인쇄","school",{rem:[{date:"2026-10-25",time:"20:00"}],subs:[{t:"학습지 30부",done:true},{t:"PPT 점검",done:false},{t:"모둠 이름표",done:false}]});
task("2026-10-27",null,"엄마 생신 선물 주문","personal",{rem:[{date:"2026-10-25",time:"21:00"}]});
task("2026-10-30","18:00","연수 결과 보고서 제출","school",{rem:[{date:"2026-10-29",time:"09:00"},{date:"2026-10-30",time:"09:00"}],src:"디스코드",subs:[{t:"연수 자료 정리",done:true},{t:"소감 작성",done:false},{t:"결재 올리기",done:false}]});
task("2026-11-04",null,"체험학습 동의서 회수","school",{rem:[{date:"2026-11-03",time:"08:30"}],src:"휴대폰 사진",subs:[{t:"1모둠",done:true},{t:"2모둠",done:true},{t:"3모둠",done:false},{t:"미제출자 명단",done:false}]});
task("2026-11-20",null,"자동차 보험 갱신","personal");
task("2026-10-24",null,"관리비 납부","personal");
per("2026-10-19","2026-10-30","수행평가 채점 기간","school");

let INBOX=[{time:"08:12",t:"가정통신문 사진",src:"휴대폰",st:"완료",out:"할 일 1 · 하위 4"},{time:"09:40",t:"음성 메모 0:06",src:"잠금화면",st:"완료",out:"일정 1"},{time:"11:05",t:"2학기 평가계획.hwp",src:"데스크톱",st:"분석 중",out:""},{time:"13:30",t:"단톡방 캡처",src:"디스코드",st:"검토 필요",out:"날짜 못 찾음"}];
const ICON={
 cam:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>',
 mic:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
 send:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
 snooze:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 4 2.5 6.5M19 4l2.5 2.5"/></svg>',
 check:'<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>'};
function bar(id,lastId,inSheet){return `${inSheet?"":`<div class="grab" data-drag="${id[0]}" title="끌어 올리면 대화 기록"><i></i></div><div class="last" id="${lastId}"></div>`}<div class="inp g"><input id="${id}" autocomplete="off"><button class="ic" data-demo="photo" title="사진">${ICON.cam}</button><button class="ic" data-demo="voice" title="말하기">${ICON.mic}</button><button class="ic go" data-go="${id}" title="넣기">${ICON.send}</button></div>`}
const THEME_ALARM=r=>`<div class="al-in"><div class="al-kind">${r.kind==="ev"?"일정":"할 일"} 알람 · ${r.time}</div><div class="al-ring"><svg viewBox="0 0 100 100"><use href="#logo"/></svg></div><div class="al-title">${r.title}</div><div class="al-body">${r.body}</div><div class="al-btns"><div><button class="al-b" data-alarm="snooze">${ICON.snooze}</button><span>10분 뒤</span></div><div><button class="al-b ok" data-alarm="done">${ICON.check}</button><span>${r.kind==="task"?"완료":"확인"}</span></div></div><div class="al-hint">누를 때까지 소리와 진동이 계속됩니다</div></div>`;

const byId=id=>EV.find(e=>e.id===id)||TASK.find(e=>e.id===id)||PER.find(e=>e.id===id);
const evOn=k=>EV.filter(e=>e.date===k&&!e.gone).sort((a,b)=>a.s.localeCompare(b.s));
const dueOn=k=>TASK.filter(t=>t.due===k&&!t.gone);
const perOn=k=>PER.filter(p=>p.from<=k&&k<=p.to&&!p.gone);
const pending=()=>EV.filter(e=>e.p&&!e.gone);
function dday(t){if(t.done)return "";const n=diffDays(TODAY,t.due);if(n<0)return `<span class="dd hot">${-n}일 지남</span>`;if(n===0)return `<span class="dd hot">오늘${t.dueT?" "+t.dueT:""}</span>`;return `<span class="dd ${n<=2?"soon":""}">D-${n}</span>`}
function remsOn(k){const r=[];
  for(const e of EV)if(!e.gone&&e.rem&&e.date===k)r.push({time:e.rem,title:e.t,body:`${e.s} 시작 · ${mins(e.s)-mins(e.rem)}분 전`,ref:e.id,kind:"ev"});
  for(const t of TASK)if(!t.gone&&!t.done)for(const x of t.rem)if(x.date===k)r.push({time:x.time,title:t.t,body:`${fd(t.due)}${t.dueT?" "+t.dueT:""}까지${t.subs.length?` · 하위 ${t.subs.filter(s=>s.done).length}/${t.subs.length}`:""}`,ref:t.id,kind:"task"});
  return r.sort((a,b)=>a.time.localeCompare(b.time));}

/* ===== shared renderers ===== */
function evChip(e){return `<span class="c ${e.a} ${e.p?"prov":""}" data-ev="${e.id}">${e.s.replace(/^0/,"")} ${e.t}${e.p?'<span class="ga">가</span>':""}</span>`}
function taskChip(t){return `<span class="c task ${t.done?"done":""}" data-ev="${t.id}">☐ ${t.t}${t.subs.length?` ${t.subs.filter(s=>s.done).length}/${t.subs.length}`:""}</span>`}
function perBar(p,k,dow){const st=p.from===k||dow===0,en=p.to===k||dow===6;return `<span class="pb ${p.a} ${p.from===k?"st":""} ${p.to===k?"en":""}" title="${p.t} ${fd(p.from)}–${fd(p.to)}">${st?p.t:"&nbsp;"}</span>`}
function monthHTML(cur,max){
  const f=new Date(cur.getFullYear(),cur.getMonth(),1),s0=add(f,-f.getDay());
  const allPer=PER.filter(p=>!p.gone).sort((a,b)=>a.from.localeCompare(b.from));
  let h=[...DOW].map((x,i)=>`<div class="dw" ${i===0?'style="color:#ff7d8f"':""}>${x}</div>`).join("");
  for(let i=0;i<42;i++){const d=add(s0,i),k=ymd(d),ps=allPer.filter(p=>p.from<=k&&k<=p.to),items=[...evOn(k).map(evChip),...dueOn(k).map(taskChip)];
    h+=`<div class="cell ${d.getMonth()!==cur.getMonth()?"out":""} ${k===TODAY?"today":""} ${d.getDay()===0?"sun":""}" data-day="${k}"><span class="n">${d.getDate()}</span>${ps.map(p=>perBar(p,k,d.getDay())).join("")}${items.slice(0,max).join("")}${items.length>max?`<div class="more">+${items.length-max}</div>`:""}</div>`}
  return `<div class="month g">${h}</div>`;
}
function ttHTML(k,{H0=7,H1=24,rowH=28}={}){
  const evs=evOn(k),rems=remsOn(k);let h=`<div class="mh0"></div>${[10,20,30,40,50,60].map(x=>`<div class="mh">${x}</div>`).join("")}`;
  for(let H=H0;H<H1;H++){const A=H*60,B=A+60;
    const segs=evs.filter(e=>mins(e.s)<B&&mins(e.e)>A).map(e=>({e,s:Math.max(mins(e.s),A),en:Math.min(mins(e.e),B),first:mins(e.s)>=A}));
    const ovl=segs.some((x,i)=>segs.some((y,j)=>i<j&&x.s<y.en&&y.s<x.en));
    let r=`<i></i><i></i><i></i><i></i><i></i><i></i>`;

function dateWord(t,base){
  for(const[w,v]of Object.entries({"오늘":0,"내일":1,"모레":2,"글피":3}))if(t.includes(w))return{d:add(base,v),m:w};
  let m=t.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){let d=new Date(2026,+m[1]-1,+m[2]);if(d<base)d.setFullYear(2027);return{d,m:m[0]}}
  m=t.match(/(다음\s*주\s*)?(이번\s*주\s*)?([월화수목금토일])요일/);
  if(m){const wd=DOW.indexOf(m[3]);let d=add(base,(wd-base.getDay()+7)%7);if(m[1])d=add(add(base,7-((base.getDay()+6)%7)),(wd+6)%7);else if(+d===+base&&!m[2])d=add(d,7);return{d,m:m[0]}}
  return null}
function timeWord(t){const m=t.match(/(오전|오후|아침|저녁|밤|점심)?\s*(\d{1,2})시\s*(반|(\d{1,2})분)?/);if(!m)return null;let h=+m[2];if(["오후","저녁","밤"].includes(m[1])&&h<12)h+=12;if(!m[1]&&h>=1&&h<=7)h+=12;return{t:hm(h*60+(m[3]==="반"?30:(m[4]?+m[4]:0))),m:m[0]}}
function parse(text){
  const base=new Date(DAY0);let t=text.trim(),subs=[];
  const area=/학교|학년|학생|학부모|교무|교과|수업|담임|상담|시험|생기부|생활기록부|교직원|통신문|체험학습|동아리|협의회|조회|출석부|수행평가|고사|출제|평가|연수|보고서|결재|협의록/.test(text)?"school":"personal";
  // period: 11월 3일부터 6일까지 / 11월 3일~11월 6일
  let m=t.match(/(\d{1,2})월\s*(\d{1,2})일\s*(?:부터|~|-)\s*(?:(\d{1,2})월\s*)?(\d{1,2})일\s*(?:까지)?/);
  if(m){const from=new Date(2026,+m[1]-1,+m[2]),to=new Date(2026,+(m[3]||m[1])-1,+m[4]);const title=t.replace(m[0],"").replace(/기간|동안|이야|이에요|입니다/g,"").trim()||"기간";return{kind:"per",t:title,a:area,from:ymd(from),to:ymd(to)}}
  // sub-checklist after colon
  // reminder first: "내일 9시에 알려줘" (anywhere in the sentence)
  let rem=null;const rm=t.match(/,?\s*((?:오늘|내일|모레|[월화수목금토일]요일)\s*)?((?:오전|오후|아침|저녁|밤)?\s*\d{1,2}시\s*(?:반|\d{1,2}분)?)에?\s*(알려\s*줘|알림)/);
  if(rm){const dw=rm[1]?dateWord(rm[1],base):null;const tw=timeWord(rm[2]);rem={date:ymd(dw?dw.d:base),time:tw.t};t=t.replace(rm[0],"").trim()}
  if(t.includes(":")){const[a,b]=t.split(":");t=a.trim();subs=b.split(/,|·|\//).map(x=>x.trim()).filter(Boolean)}
  const dw=dateWord(t,base);if(dw)t=t.replace(dw.m,"");
  const tw=timeWord(t);if(tw)t=t.replace(tw.m,"");
  const isTask=subs.length||/까지|제출|내기|사기|주문|하기|신청|납부|입력|정리|인쇄|회수|준비/.test(text)&&!/회의|진료|모임|레슨|수업$/.test(text);
  let title=t.replace(/(에|에서|까지|부터)(\s|$)/g," ").replace(/(일정|스케줄)?\s*(추가|등록|잡아|넣어)\s*(해)?\s*(줘|주세요)?|해야\s*(돼|함)|있어|해줘/g,"").replace(/\s+/g," ").replace(/^[,\s]+|[,\s]+$/g,"").trim()||"메모";
  if(isTask)return{kind:"task",t:title,a:area,due:ymd(dw?dw.d:base),dueT:tw?tw.t:null,rem:rem?[rem]:[],subs:subs.map(x=>({t:x,done:false}))};
  if(!dw&&!tw)return{kind:"missing",t:title};
  const s=tw?tw.t:"09:00",d=dw?dw.d:(mins(s)<nowM?add(base,1):base);
  return{kind:"ev",t:title,a:area,date:ymd(d),s,e:hm(Math.min(mins(s)+60,1439)),rem:rem?rem.time:hm(Math.max(0,mins(s)-30))};
}
function ingest(src,results,msg,kind){const before=uid;
  for(const r of results){
    if(r.kind==="missing"){LOG.push({t:"확인 필요",msg:`「${r.t}」 날짜를 못 찾음`,src});continue}
    if(r.kind==="per"){per(r.from,r.to,r.t,r.a);LOG.push({t:"기간",msg:`${r.t} · ${fd(r.from)}–${fd(r.to)}`,src,ref:PER[PER.length-1].id});continue}
    if(r.kind==="task"){task(r.due,r.dueT,r.t,r.a,{rem:r.rem,subs:r.subs,src});const x=TASK[TASK.length-1];LOG.push({t:"할 일",msg:`${x.t} · ${fd(x.due)}${x.dueT?" "+x.dueT:""}까지${x.subs.length?` · 하위 ${x.subs.length}개`:""}${x.rem.length?` · 알림 ${x.rem.map(z=>(z.date===TODAY?"":fd(z.date)+" ")+z.time).join(", ")}`:""}`,src,ref:x.id});continue}
    ev(r.date,r.s,r.e,r.t,r.a,{p:true,src,rem:r.rem});const e=EV[EV.length-1];LOG.push({t:"넣음",msg:`${fd(e.date)} ${e.s} ${e.t} · ${e.rem} 알림`,src,ref:e.id});
  }
  LOG[LOG.length-1].fresh=true;chatPush(src,results,msg,kind,before);INBOX.push({time:hm(nowM),t:src.includes("사진")?"사진":src.includes("음성")?"음성 메모":"문장",src,st:"완료",out:`${results.length}개`});
  renderAll();
}

document.addEventListener("pointerdown",e=>{const g=e.target.closest("[data-drag]");if(!g)return;DRAG={y:e.clientY,h:g.dataset.drag,inSheet:!!g.dataset.insheet};e.preventDefault()});
document.addEventListener("pointermove",e=>{if(!DRAG)return;const dy=e.clientY-DRAG.y,el=document.getElementById(DRAG.h+"Chat");el.style.transition="none";
  if(!DRAG.inSheet&&dy<0)el.style.transform=`translateY(calc(105% + ${dy}px))`;else if(DRAG.inSheet&&dy>0)el.style.transform=`translateY(${dy}px)`});
document.addEventListener("pointerup",e=>{if(!DRAG)return;const dy=e.clientY-DRAG.y,el=document.getElementById(DRAG.h+"Chat");el.style.transition="";el.style.transform="";
  if(Math.abs(dy)<6)sheet(DRAG.h,!DRAG.inSheet);else if(!DRAG.inSheet&&dy<-40)sheet(DRAG.h,true);else if(DRAG.inSheet&&dy>40)sheet(DRAG.h,false);DRAG=null});
const srcOf=id=>id[0]==="d"?"데스크톱":id==="lockIn"?"잠금화면":id==="wIn"?"홈 위젯":"휴대폰";

/* ===== alarm: full screen, sound + vibration until answered ===== */
let ALQ=[],ALON=null,ACTX=null,RING=null;
function fire(r){ALQ.push(r);if(!ALON)nextAlarm()}
function nextAlarm(){ALON=ALQ.shift()||null;const on=!!ALON;
  for(const id of ["dAlarm","pAlarm"]){const el=document.getElementById(id);el.classList.toggle("on",on);el.innerHTML=on?THEME_ALARM(ALON):""}
  document.getElementById("phone").classList.toggle("buzz",on);document.getElementById("win").classList.toggle("buzz",on);
  if(on){startRing();try{navigator.vibrate&&navigator.vibrate([900,300,900,300,900,300,900,300,900])}catch(e){}}else{stopRing();try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}}
function startRing(){try{ACTX=ACTX||new(window.AudioContext||window.webkitAudioContext)();ACTX.resume&&ACTX.resume()}catch(e){return}
  const beep=()=>{const t0=ACTX.currentTime;[[0,880],[.16,1320],[.32,880],[.48,1320]].forEach(([t,f])=>{const o=ACTX.createOscillator(),g=ACTX.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.3,t0+t+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+t+.14);o.connect(g);g.connect(ACTX.destination);o.start(t0+t);o.stop(t0+t+.15)})};
  beep();clearInterval(RING);RING=setInterval(beep,1300)}
function stopRing(){clearInterval(RING);RING=null}
function alarmAct(a){const r=ALON;if(!r)return;const x=byId(r.ref);
  if(a==="done"&&x&&r.kind==="task"){x.done=true;x.subs.forEach(s=>s.done=true)}
  if(a==="snooze"&&x){const at=hm(nowM+10);if(Array.isArray(x.rem))x.rem.push({date:TODAY,time:at});else x.rem=at;LOG.push({t:"다시 알람",msg:`${at} ${x.t}`,src:"알람"})}
  nextAlarm();renderAll()}

/* ===== phone ===== */
const P={tab:"today",cur:new Date(DAY0),cal:"month"};
function composer(){return `<div class="composer">${bar("pIn","pLast")}</div>`}
function tabs(){return `<div class="tabs">${[["today","오늘"],["cal","달력"],["lock","잠금화면"],["home","홈 위젯"]].map(([k,l])=>`<button data-tab="${k}" class="${P.tab===k?"on":""}">${l}</button>`).join("")}</div>`}
function renderPhone(){
  const v=document.getElementById("pMain"),c=P.cur,k=ymd(c);
  document.getElementById("pClock").textContent=`${Math.floor(nowM/60)%12||12}:${pad(nowM%60)}`;
  if(P.tab==="today"){const G=taskGroups(k),ps=perOn(k);
    v.innerHTML=`<div class="phbar"><div class="title">${c.getMonth()+1}월 ${c.getDate()}일 ${DOW[c.getDay()]}</div><button class="nb" data-pn="-1">‹</button><button class="nb" data-pn="1">›</button><button class="nb" data-pn="0">오늘</button></div>
     <div class="phbody">${ps.length?`<div class="box g">${ps.map(p=>perRow(p,k)).join("")}</div>`:""}
      <div class="box g"><h4>할 일</h4><div class="grp">오늘까지</div>${G.today.map(t=>taskHTML(t,{showSubAdd:false})).join("")||'<div style="color:var(--ink3)">없음</div>'}<div class="grp">7일 안 마감</div>${G.week.map(t=>taskHTML(t,{showSubAdd:false})).join("")}</div>
      ${ttHTML(k,{H0:7,H1:24,rowH:22})}</div>${composer()}${tabs()}`}
  if(P.tab==="cal")v.innerHTML=`<div class="phbar"><div class="title">${c.getFullYear()}년 ${c.getMonth()+1}월</div><button class="nb" data-pm="-1">‹</button><button class="nb" data-pm="1">›</button></div><div class="phbody">${monthHTML(c,3)}</div>${composer()}${tabs()}`;
  if(P.tab==="lock"){const tl=evOn(TODAY),G=taskGroups(TODAY),ps=perOn(TODAY),next=remsOn(TODAY).find(r=>mins(r.time)>nowM);
    v.innerHTML=`<div class="lock"><div class="date">10월 25일 일요일</div><div class="clock">${Math.floor(nowM/60)%12||12}:${pad(nowM%60)}</div>
      ${ps.length?`<div class="lp" style="padding:6px 11px">${ps.map(p=>`<div style="font-size:12px;display:flex;justify-content:space-between"><span>${p.t}</span><span style="opacity:.75">${diffDays(p.from,TODAY)+1}/${diffDays(p.from,p.to)+1}일</span></div>`).join("")}</div>`:""}
      <div class="lp"><h5>오늘 일정 <small>${next?`다음 알림 ${next.time} ${next.title}`:""}</small></h5>${tl.map(e=>`<div class="lr ${mins(e.e)<=nowM?"past":""}"><span class="tm">${e.s}</span><span class="dot d-${e.a}"></span>${e.t}${e.p?'<span class="ga" style="background:#fff;color:#111">가</span>':""}</div>`).join("")}</div>
      <div class="lp"><h5>할 일 <small>마감 순</small></h5>${[...G.today,...G.week].map(t=>`<div class="lr" style="font-size:13.5px"><span class="tm" style="width:auto">${t.done?"☑":"☐"}</span><span style="${t.done?"text-decoration:line-through;opacity:.5":""}">${t.t}${t.subs.length?` <span style="opacity:.7;font-size:11.5px">${t.subs.filter(s=>s.done).length}/${t.subs.length}</span>`:""}</span><span style="margin-left:auto">${dday(t)}</span></div>`).join("")}</div>
      <div class="ln" style="margin-top:auto"><div class="row"><input id="lockIn" autocomplete="off"><button class="ic" data-demo="voice" title="말하기">${ICON.mic}</button><button class="ic" data-demo="photo" title="사진">${ICON.cam}</button><button class="ic go" data-go="lockIn" title="넣기">${ICON.send}</button></div></div>
      <div class="cap">잠금화면 = 자동으로 바뀌는 배경화면 + 항상 떠 있는 입력 알림</div></div>${tabs()}`}
  if(P.tab==="home"){const tl=evOn(TODAY),G=taskGroups(TODAY),w=wk(DAY0);
    const wrow=x=>{const d=pd(x),l=[...evOn(x).map(e=>`<span class="wi"><span style="opacity:.6">${e.s.replace(/^0/,"")}</span> ${e.t}</span>`),...dueOn(x).map(t=>`<span class="wi">☐ ${t.t}</span>`)];return `<div class="wr ${x===TODAY?"on":""}"><span class="wd">${DOW[d.getDay()]} ${d.getDate()}</span><span class="wl">${l.join("")||'<span style="opacity:.35">—</span>'}</span></div>`};
    const perLine=ws=>{const ps=PER.filter(p=>!p.gone&&p.from<=ws[6]&&p.to>=ws[0]);return ps.length?`<div style="font-size:11px;opacity:.6;margin-bottom:3px">${ps.map(p=>`${p.t} ~${fd(p.to)}`).join(" · ")}</div>`:""};
    v.innerHTML=`<div class="home">
      <div class="wg"><h5>오늘 <small>10/25 일 · 확인 대기 ${pending().length}</small></h5><div class="w2"><div>${tl.map(e=>`<div class="lr ${mins(e.e)<=nowM?"past":""}" style="font-size:12.5px"><span class="tm" style="width:36px">${e.s}</span>${e.t}</div>`).join("")}</div>
        <div>${[...G.today,...G.week].slice(0,5).map(t=>`<div class="lr" style="font-size:12.5px"><span style="${t.done?"text-decoration:line-through;opacity:.5":""}">${t.done?"☑":"☐"} ${t.t}</span><span style="margin-left:auto">${dday(t)}</span></div>`).join("")}</div></div></div>
      <div class="wg"><h5>이번 주</h5>${perLine(w)}${w.map(wrow).join("")}</div>
      <div class="wg"><h5>다음 주</h5>${perLine(wk(add(DAY0,7)))}${wk(add(DAY0,7)).map(wrow).join("")}</div>
      <div class="wg" style="padding:7px 10px"><div class="ln" style="background:none;border:0;padding:0"><div class="row"><input id="wIn" autocomplete="off"><button class="ic" data-demo="voice" title="말하기">${ICON.mic}</button><button class="ic" data-demo="photo" title="사진">${ICON.cam}</button><button class="ic go" data-go="wIn" title="넣기">${ICON.send}</button></div></div></div>
     </div>${tabs()}`}
  renderLog();
}

/* ===== print ===== */
function printSheet(){
  const c=D.cur,k=ymd(c);let html;
  if(D.view==="month"){const f=new Date(c.getFullYear(),c.getMonth(),1),s0=add(f,-f.getDay());
    html=`<h1>${c.getFullYear()}년 ${c.getMonth()+1}월 <small>블랙홀</small></h1><div class="pmonth">${[...DOW].map(x=>`<div class="dw">${x}</div>`).join("")}${Array.from({length:42},(_,i)=>{const d=add(s0,i),x=ymd(d);return `<div style="${d.getMonth()!==c.getMonth()?"color:#aaa":""}"><b>${d.getDate()}</b>${perOn(x).filter(p=>p.from===x||d.getDay()===0).map(p=>`<div style="background:#ddd">${p.t} →${fd(p.to)}</div>`).join("")}${evOn(x).map(e=>`<div>${e.s} ${e.t}</div>`).join("")}${dueOn(x).map(t=>`<div>☐ ${t.t} 마감</div>`).join("")}</div>`}).join("")}</div>`}
  else{const G=taskGroups(k);let rows="";
    for(let H=6;H<24;H++){const A=H*60,B=A+60;let r=`<i></i><i></i><i></i><i></i><i></i><i></i>`;
      for(const e of evOn(k)){if(mins(e.s)<B&&mins(e.e)>A){const s=Math.max(mins(e.s),A),en=Math.min(mins(e.e),B);r+=`<div class="bk" style="left:${(s-A)/60*100}%;width:${(en-s)/60*100}%">${mins(e.s)>=A?e.t:""}</div>`}}
      rows+=`<div class="h ${H===6?"first":""}">${H}</div><div class="row ${H===6?"first":""}">${r}</div>`}
    const pt=t=>`<div class="pck"><span class="bx">${t.done?"✓":""}</span>${t.t}<small>${fd(t.due)}${t.dueT?" "+t.dueT:""}까지</small></div>${t.subs.map(s=>`<div class="pck sub"><span class="bx">${s.done?"✓":""}</span>${s.t}</div>`).join("")}`;
    html=`<h1>${c.getFullYear()}. ${c.getMonth()+1}. ${c.getDate()}. (${DOW[c.getDay()]}) <small>블랙홀 · 하루 플래너</small></h1>
      <div class="pper">${perOn(k).map(p=>`${p.t} ${fd(p.from)}–${fd(p.to)} (${diffDays(p.from,k)+1}/${diffDays(p.from,p.to)+1}일)`).join(" · ")||"&nbsp;"}</div>
      <div class="cols"><div class="ptt">${rows}</div><div>
        <h3>할 일</h3>${G.today.map(pt).join("")}${G.week.map(pt).join("")}${Array.from({length:3},()=>`<div class="pck"><span class="bx"></span></div>`).join("")}
        <h3 style="margin-top:14px">일정 · 알림</h3>${evOn(k).map(e=>`<div class="pck">${e.s}–${e.e} ${e.t}${e.rem?`<small>알림 ${e.rem}</small>`:""}</div>`).join("")}
        <h3 style="margin-top:14px">메모</h3>${Array.from({length:7},()=>`<div class="line"></div>`).join("")}
      </div></div>`}
  document.getElementById("sheet").innerHTML=html;document.getElementById("printModal").classList.add("on");
}

/* ===== glue ===== */
function renderAll(){renderDesk();renderPhone();renderLog();document.getElementById("clockLbl").textContent=`10/25(일) ${hm(nowM)}`}
document.addEventListener("click",ev=>{const t=ev.target,q=s=>t.closest(s);
  if(q("[data-alarm]")){alarmAct(q("[data-alarm]").dataset.alarm);return}
  if(q("[data-drag]"))return;
  if(q("[data-close]")){const card=q(".nt");const ref=card&&card.dataset.nref;
    if(q("[data-tdone]")){const x=byId(+q("[data-tdone]").dataset.tdone);x.done=true}
    if(q("[data-snooze]")){const x=byId(+q("[data-snooze]").dataset.snooze);const at=hm(nowM+10);if(x.rem&&Array.isArray(x.rem))x.rem.push({date:TODAY,time:at});else x.rem=at}
    document.querySelectorAll(`.nt[data-nref="${ref}"]`).forEach(n=>n.remove());renderAll();return}
  if(q("[data-adv]")){const a=q("[data-adv]").dataset.adv;advance(a==="to1500"?15*60:a==="to1630"?16*60+30:nowM+(+a));return}
  if(q("[data-ok]")){byId(+q("[data-ok]").dataset.ok).p=false;renderAll();return}
  if(q("[data-no]")){const e=byId(+q("[data-no]").dataset.no);e.gone=true;e.p=false;LOG.push({t:"취소",msg:e.t,fresh:true});renderAll();return}
  if(q("[data-tdone]")){const x=byId(+q("[data-tdone]").dataset.tdone);x.done=!x.done;if(x.done)x.subs.forEach(s=>s.done=true);renderAll();return}
  if(q("[data-sub]")){const[id,i]=q("[data-sub]").dataset.sub.split(":");const x=byId(+id);x.subs[+i].done=!x.subs[+i].done;x.done=x.subs.length>0&&x.subs.every(s=>s.done);renderAll();return}
  if(q("[data-demo]")){demo(q("[data-demo]").dataset.demo);return}
  if(q("[data-go]")){const id=q("[data-go]").dataset.go;submit(id,srcOf(id));return}
  if(q("[data-tab]")){P.tab=q("[data-tab]").dataset.tab;renderPhone();return}
  if(q("#printBtn")){printSheet();return}
  if(q("#closePrint")){document.getElementById("printModal").classList.remove("on");return}
  if(q(".subadd"))return;
  if(q("#win")){
    if(q("[data-v]")){D.view=q("[data-v]").dataset.v;renderDesk();return}
    if(q("[data-nav]")){const n=+q("[data-nav]").dataset.nav;if(!n)D.cur=new Date(DAY0);else if(D.view==="month")D.cur=new Date(D.cur.getFullYear(),D.cur.getMonth()+n,1);else D.cur=add(D.cur,n*(D.view==="week"?7:1));renderDesk();return}
    const dd=q("[data-day]");if(dd){D.cur=pd(dd.dataset.day);D.view="day";renderDesk();return}
    const e=q("[data-ev]");if(e&&D.view!=="day"){const x=byId(+e.dataset.ev);D.cur=pd(x.date||x.due);D.view="day";renderDesk();return}
  }
  if(q("#phone")){
    if(q("[data-pn]")){const n=+q("[data-pn]").dataset.pn;P.cur=n?add(P.cur,n):new Date(DAY0);renderPhone();return}
    if(q("[data-pm]")){const n=+q("[data-pm]").dataset.pm;P.cur=new Date(P.cur.getFullYear(),P.cur.getMonth()+n,1);renderPhone();return}
    const dd=q("[data-day]");if(dd&&P.tab==="cal"){P.cur=pd(dd.dataset.day);P.tab="today";renderPhone();return}
  }
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const el=e.target;
  if(el.dataset&&el.dataset.subadd){const v=el.value.trim();if(!v)return;const x=byId(+el.dataset.subadd);x.subs.push({t:v,done:false});x.done=false;renderAll();const again=document.querySelector(`[data-subadd="${x.id}"]`);if(again)again.focus();return}
  const id=el.id;if(id==="dChatIn"||id==="pChatIn"){submit(id,srcOf(id));return}if(id==="dIn")submit("dIn","데스크톱");if(id==="pIn")submit("pIn","휴대폰");if(id==="lockIn")submit("lockIn","잠금화면");if(id==="wIn")submit("wIn","홈 위젯")});
document.getElementById("devSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#devSeg button").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("win").style.display=b.dataset.dev==="phone"?"none":"";document.getElementById("phone").style.display=b.dataset.dev==="desk"?"none":""};
document.getElementById("thSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#thSeg button").forEach(x=>x.classList.toggle("on",x===b));document.documentElement.dataset.theme=b.dataset.th};
document.getElementById("dComp").innerHTML=bar("dIn","dLast");document.getElementById("dChat").innerHTML=sheetHTML("d");document.getElementById("pChat").innerHTML=sheetHTML("p");
renderAll();
</script>
</body>
</html>
