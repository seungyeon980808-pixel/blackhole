<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블랙홀 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{
  --ink:#111;--ink2:#444;--ink3:#8a8a8a;--rule:#111;--hair:#cfcfcf;--shade:#e3e8f1;--shade2:#f2f4f8;
  --navy:#1f3a68;--red:#c00000;--paper:#fff;--desk:#d9dadd;
  --ev-school:#d5dcea;--ev-personal:#e9e9e9;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--serif);color:var(--ink);background:var(--desk);font-size:13.5px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
/* page controls (outside the devices) */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;font-family:var(--sans)}
.ctl .name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-right:auto}
.ctl .name svg{width:26px;height:26px}
.demo{font-size:12px;color:var(--ink2);display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--ink);font-size:13px;margin:0 4px}
.btn{font-family:var(--sans);font-size:12px;border:1px solid #777;background:#fff;padding:3px 9px;border-radius:2px}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.go{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.seg{display:inline-flex}.seg .btn+.btn{margin-left:-1px}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:4px 20px 30px;flex-wrap:wrap}
/* ---------- desktop ---------- */
.win{width:1180px;height:780px;border-radius:8px;overflow:hidden;background:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.22);display:grid;grid-template-rows:28px auto auto 1fr auto;flex:none;position:relative}
.chrome{display:flex;align-items:center;gap:7px;padding:0 12px;background:#f1f1f1;border-bottom:1px solid var(--hair)}
.chrome i{width:11px;height:11px;border-radius:50%}
.tool{display:flex;align-items:center;gap:5px;padding:8px 22px 0}
.sp{flex:1}
.head{padding:4px 22px 0}
.dtitle{border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);padding:6px 0;text-align:center;font-family:var(--sans);font-weight:800;font-size:21px;letter-spacing:-.5px}
.summary{margin-top:6px;border:1px solid var(--rule);background:var(--shade);padding:5px 12px;font-family:var(--sans);font-weight:700;font-size:13px}
.content{min-height:0;padding:10px 22px 0;overflow:hidden}
/* section header: navy roman box + underlined title */
.sec{display:flex;align-items:stretch;gap:8px;margin:0 0 6px}
.sec .no{background:var(--navy);color:#fff;font-family:var(--sans);font-weight:800;font-size:12.5px;min-width:24px;display:grid;place-items:center;padding:1px 6px}
.sec .st{flex:1;border-bottom:1.5px solid var(--rule);font-family:var(--sans);font-weight:800;font-size:15px;padding-bottom:1px;display:flex;justify-content:space-between;align-items:flex-end}
.sec .st small{font-weight:400;font-size:11.5px;color:var(--ink2)}
.blk+.blk{margin-top:12px}
/* tables */
table.tb{width:100%;border-collapse:collapse;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);font-size:12.5px}
.tb th{background:var(--shade);font-family:var(--sans);font-weight:700;font-size:11.5px;padding:3px 5px;border:1px solid var(--hair);border-top:0;text-align:center}
.tb td{padding:3px 6px;border:1px solid var(--hair);vertical-align:top}
.tb tr>*:first-child{border-left:0}.tb tr>*:last-child{border-right:0}
.tb td.c{text-align:center;font-family:var(--sans);white-space:nowrap}
.tb .muted{color:var(--ink3)}
.tb .past td{color:var(--ink3)}
.tb.week td{height:auto}
.tb.week .today td{background:var(--shade2)}
/* marks: □ task, ○ sub, - detail */
.li{display:flex;gap:6px;align-items:baseline;line-height:1.45}
.mk{font-family:var(--sans);cursor:pointer;flex:none;width:14px;text-align:center}
.l1{font-size:14px;font-weight:700;padding:3px 0 0}
.l2{font-size:13px;padding:1px 0 0 16px}
.l3{font-size:11.5px;color:var(--ink2);padding:0 0 0 20px;font-family:var(--sans)}
.done .tx{text-decoration:line-through;color:var(--ink3)}
.dd{margin-left:auto;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.dd.hot{color:var(--red)}
.grp{font-family:var(--sans);font-size:11.5px;font-weight:800;color:var(--navy);margin:8px 0 0}
.subadd{border:0;border-bottom:1px dotted var(--hair);outline:0;font-size:12px;padding:1px 0;width:calc(100% - 36px);margin-left:36px;display:none;background:none}
.task:hover .subadd,.subadd:focus{display:block}
.ga{font-family:var(--sans);font-size:10.5px;font-weight:700;border:1px solid var(--ink);padding:0 3px;margin-left:4px}
.mini{font-family:var(--sans);font-size:11px;border:1px solid #777;background:#fff;padding:0 6px;margin-left:3px}
/* 10-minute timetable */
.tt{display:grid;grid-template-columns:26px repeat(6,minmax(0,1fr));border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.tt .mh0,.tt .mh{background:var(--shade);font-family:var(--sans);font-size:10.5px;font-weight:700;text-align:center;padding:2px 0;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair)}
.tt .mh0{border-left:0}
.tt .h{font-family:var(--sans);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--hair);background:var(--shade2)}
.tt .row{grid-column:2 / span 6;position:relative;border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(6,1fr)}
.tt .row i{border-left:1px dotted var(--hair)}
.tt .row i:first-child{border-left:1px solid var(--hair)}
.tt .row i:nth-child(4){border-left:1px solid #9a9a9a}
.tt .bk{position:absolute;top:2px;bottom:2px;font-size:11px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;border:1px solid #6d6d6d}
.tt .bk.school{background:var(--ev-school)}.tt .bk.personal{background:var(--ev-personal)}
.tt .bk.prov{border-style:dashed;background:#fff}
.tt .bk.half{bottom:50%}.tt .bk.half2{top:50%}
.tt .now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--red);z-index:3}
.tt .rm{position:absolute;top:4px;bottom:4px;width:0;border-left:1px dashed #555;z-index:2}
.tt .row.past{background:repeating-linear-gradient(135deg,transparent 0 4px,#f3f3f3 4px 5px)}
/* day layout */
.day{display:grid;grid-template-columns:400px minmax(0,1fr) minmax(0,1.05fr);gap:22px;height:100%;min-height:0}
.colx{min-height:0;overflow:auto;padding-bottom:6px}
/* month */
table.cal{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.cal th{background:var(--shade);font-family:var(--sans);font-size:11.5px;padding:3px;border:1px solid var(--hair);border-top:0}
.cal td{border:1px solid var(--hair);vertical-align:top;padding:2px 3px;overflow:hidden;cursor:pointer}
.cal tr>*:first-child{border-left:0}.cal tr>*:last-child{border-right:0}
.cal .n{font-family:var(--sans);font-weight:800;font-size:11.5px}
.cal .out{color:#bbb}
.cal .today{background:var(--shade2)}
.cal .today .n{background:var(--navy);color:#fff;padding:0 4px}
.cal .sun .n{color:var(--red)}.cal .today.sun .n{color:#fff}
.cal .e{font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .e .t{font-family:var(--sans);color:var(--ink2);font-size:10.5px}
.cal .e.prov{border-bottom:1px dashed var(--ink)}
.cal .e.done{text-decoration:line-through;color:var(--ink3)}
.cal .pb{font-family:var(--sans);font-size:10px;font-weight:700;line-height:13px;height:13px;background:var(--shade);margin:1px -4px 0;padding:0 5px;white-space:nowrap;overflow:hidden;color:var(--navy)}
.cal .more{font-family:var(--sans);font-size:10px;color:var(--ink3)}
/* composer */
.composer{padding:8px 22px 12px;border-top:1px solid var(--hair);margin-top:8px}
.log{font-size:12px;color:var(--ink2);margin-bottom:5px;max-height:54px;overflow:auto}
.lg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.lg b{font-family:var(--sans);color:var(--ink)}
.lg a{font-family:var(--sans);font-size:11px;border:1px solid #777;padding:0 4px;margin-left:4px;cursor:pointer;color:var(--ink)}
.lg.new{background:var(--shade2)}
.form{display:flex;border:1.5px solid var(--rule)}
.form .lab{background:var(--shade);font-family:var(--sans);font-weight:800;font-size:12.5px;padding:0 12px;display:grid;place-items:center;border-right:1px solid var(--rule);white-space:nowrap}
.form input{flex:1;border:0;outline:0;padding:8px 10px;font-size:14px;min-width:0;font-family:var(--serif)}
.form button{border:0;border-left:1px solid var(--rule);background:#fff;font-family:var(--sans);font-size:12.5px;padding:0 12px}
.form button.go{background:var(--ink);color:#fff;font-weight:800}
/* notifications */
.nstack{position:absolute;top:34px;right:14px;width:320px;display:flex;flex-direction:column;gap:8px;z-index:20}
.nt{background:#fff;border:1.5px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:12.5px}
.nt .nh{background:var(--shade);border-bottom:1px solid var(--rule);font-family:var(--sans);font-weight:800;font-size:11.5px;padding:3px 8px;display:flex;justify-content:space-between}
.nt .nbd{padding:6px 8px}
.nt b{font-size:14px}
.nt .na{display:flex;gap:4px;margin-top:5px}
/* ---------- phone ---------- */
.phone{width:380px;height:820px;border-radius:48px;padding:11px;background:#121214;box-shadow:0 18px 50px rgba(0,0,0,.35);flex:none}
.scr{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;position:relative}
.sb{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--sans);font-size:12.5px;font-weight:700}
.isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#000;z-index:4}
.ph{flex:1;min-height:0;display:flex;flex-direction:column}
.phtool{display:flex;gap:4px;align-items:center;padding:0 14px 4px}
.phbody{flex:1;overflow:auto;padding:0 14px 8px;min-height:0}
.phone .dtitle{font-size:17px;padding:4px 0}
.phone .summary{font-size:11.5px;padding:3px 8px}
.phone .tt{grid-template-columns:22px repeat(6,minmax(0,1fr))}
.phone .cal .e{font-size:9.5px;line-height:12px}
.phone .cal .pb{font-size:8.5px;height:11px;line-height:11px}
.phone .composer{padding:6px 12px 6px;margin-top:0}
.phone .form input{font-size:13px;padding:7px 8px}
.phone .form button{padding:0 8px;font-size:12px}
.tabs{display:flex;justify-content:space-around;padding:6px 8px 16px;flex:none;border-top:1.5px solid var(--rule);font-family:var(--sans)}
.tabs button{background:none;border:0;font-size:12.5px;color:var(--ink3);padding:4px 8px;font-weight:700}
.tabs button.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.phone .nstack{top:44px;left:10px;right:10px;width:auto}
/* lock & home (wallpaper + paper cards) */
.wall{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;background:linear-gradient(170deg,#4a4f5c,#22252c);overflow:auto}
.wall .date{text-align:center;color:#fff;font-family:var(--sans);font-size:14px;font-weight:700}
.wall .clock{text-align:center;color:#fff;font-family:var(--sans);font-size:68px;font-weight:400;letter-spacing:-2px;line-height:1}
.card{background:#fff;border:1px solid #333;padding:7px 10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card .ch{font-family:var(--sans);font-weight:800;font-size:11.5px;border-bottom:1.5px solid var(--rule);padding-bottom:2px;margin-bottom:3px;display:flex;justify-content:space-between}
.card .ch small{font-weight:400;color:var(--ink2)}
.card .tb{font-size:12px;border:0}
.card .tb td{padding:2px 4px}
.cap{font-family:var(--sans);font-size:10.5px;text-align:center;color:#ddd;line-height:1.5}
/* print */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:50}
.modal.on{display:flex}
.sheet{width:794px;min-height:1123px;background:#fff;padding:40px 44px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sheet .tt{grid-template-columns:28px repeat(6,minmax(0,1fr))}
.sheet .tt .h,.sheet .tt .row{height:27px}
.sheet .cols{display:grid;grid-template-columns:360px 1fr;gap:22px}
.sheet .line{height:26px;border-bottom:1px solid var(--hair)}
.sheet .foot{text-align:center;font-family:var(--sans);font-size:11px;margin-top:18px}
.mbar{position:sticky;top:0;display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printModal){display:none!important}
  #printModal{position:static;display:block;background:none;padding:0}
  .mbar{display:none}
  .sheet{box-shadow:none;width:auto;min-height:auto}
}
@media (max-width:1250px){.win{zoom:.8}}

/* composer: pull-up handle, icon buttons, chat sheet */
.grab{display:flex;justify-content:center;padding:0 0 5px;cursor:grab;touch-action:none}
.grab i{width:44px;height:4px;background:#999}
.last{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px 5px;min-height:16px}
.last b{font-family:var(--sans);color:var(--ink)}
.last a{font-family:var(--sans);font-size:11px;border:1px solid #777;padding:0 4px;margin-left:4px;cursor:pointer;color:var(--ink)}
.form button.ic{display:grid;place-items:center;padding:0 11px}
.chatsheet{position:absolute;left:0;right:0;bottom:0;height:76%;z-index:30;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;background:#fff;border-top:2px solid var(--rule);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.chatsheet.open{transform:none}
.chatsheet .grab{padding:8px 0 3px}
.sheethead{text-align:center;font-family:var(--sans);font-size:13px;font-weight:800;border-bottom:1.5px solid var(--rule);margin:0 18px;padding-bottom:4px}
.thread{flex:1;overflow:auto;padding:8px 18px;display:flex;flex-direction:column;gap:7px;min-height:0}
.bub{max-width:76%;padding:6px 10px;font-size:13.5px;line-height:1.5}
.bub.me{align-self:flex-end;border:1px solid var(--rule);background:#fff}
.bub.ai{align-self:flex-start;background:var(--shade);border:1px solid var(--hair)}
.bsrc{font-family:var(--sans);font-size:10.5px;color:var(--ink3);margin-top:-4px}
.bsrc.me{align-self:flex-end}.bsrc.ai{align-self:flex-start}
.daysep{align-self:center;font-family:var(--sans);font-size:11px;color:var(--ink3)}
.rc{margin-top:5px;padding:5px 8px;background:#fff;border:1px solid var(--hair);font-size:12.5px}
.rc.gone{color:var(--ink3);text-decoration:line-through}
.rc .rm2{font-family:var(--sans);font-size:11px;color:var(--ink2)}
.rc .ra{display:flex;gap:4px;margin-top:4px}
.bub .photo{border:1px solid var(--hair);padding:6px;font-size:11px;background:#fff}
.chatsheet .composer,.chatsheet .form{margin:6px 14px 14px}
.phone .chatsheet{height:88%}
/* alarm */
.alarm{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.alarm.on{display:flex}
.al-in{width:300px;background:#fff;border:2px solid var(--rule);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.al-head{background:var(--red);color:#fff;font-family:var(--sans);font-weight:800;font-size:13px;padding:5px 10px;display:flex;justify-content:space-between;animation:blink 1s infinite}
@keyframes blink{50%{background:var(--navy)}}
.al-pad{padding:14px 16px 16px}
.al-kind{font-family:var(--sans);font-size:12px;color:var(--ink2)}
.al-title{font-family:var(--sans);font-size:24px;font-weight:800;margin:4px 0}
.al-body{font-size:13px;color:var(--ink2)}
.al-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.al-b{height:52px;border:1.5px solid var(--rule);background:#fff;font-family:var(--sans);font-weight:800;font-size:15px}
.al-b.ok{background:var(--ink);color:#fff}
.al-hint{font-size:11px;color:var(--ink3);margin-top:10px}
.buzz{animation:buzz 1.1s infinite}
@keyframes buzz{0%,45%,100%{transform:translate(0,0)}4%,12%,20%,28%,36%{transform:translate(-3px,0) rotate(-.5deg)}8%,16%,24%,32%,40%{transform:translate(3px,0) rotate(.5deg)}}
</style>
</head>
<body>
<div class="ctl">
  <div class="name"><svg viewBox="0 0 100 100"><use href="#logo"/></svg>블랙홀 <span style="font-weight:400;font-size:12px;color:var(--ink2)">시안 · 공문서 테마 · <a href="prototype-glass.html" style="color:inherit">유리 테마 보기</a></span></div>
  <span class="demo">시각 <b id="clockLbl"></b><button class="btn" data-adv="15">+15분</button><button class="btn" data-adv="to1500">15:00으로</button><button class="btn" data-adv="to1630">16:30으로</button></span>
  <span class="demo">시연:<button class="btn" data-demo="photo">공문 사진</button><button class="btn" data-demo="voice">음성</button><button class="btn" data-demo="sub">하위 목록 문장</button><button class="btn" data-demo="period">기간 문장</button></span>
  <div class="seg" id="devSeg"><button class="btn on" data-dev="both">둘 다</button><button class="btn" data-dev="desk">데스크톱</button><button class="btn" data-dev="phone">휴대폰</button></div>
</div>

<div class="stage">
  <div class="win" id="win">
    <div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="tool"><button class="btn" data-nav="-1">‹ 이전</button><button class="btn" data-nav="1">다음 ›</button><button class="btn" data-nav="0">오늘</button><span class="sp"></span><span class="seg" id="dView"><button class="btn" data-v="month">월</button><button class="btn" data-v="week">주</button><button class="btn" data-v="day">일</button></span><button class="btn" id="printBtn" style="margin-left:6px">출력</button></div>
    <div class="head"><div class="dtitle" id="dTitle"></div><div class="summary" id="dSum"></div></div>
    <div class="content" id="dMain"></div>
    <div class="composer" id="dComp"></div>
    <div class="chatsheet" id="dChat"></div>
    <div class="alarm" id="dAlarm"></div>
  </div>

  <div class="phone" id="phone">
    <div class="scr">
      <div class="isl"></div>
      <div class="sb"><span id="pClock"></span><span>100%</span></div>
      <div class="ph" id="pMain"></div>
      <div class="chatsheet" id="pChat"></div><div class="alarm" id="pAlarm"></div>
    </div>
  </div>
</div>

<div class="modal" id="printModal"><div><div class="mbar"><button class="btn" onclick="window.print()">인쇄</button><button class="btn" id="closePrint">닫기</button></div><div class="sheet" id="sheet"></div></div></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <g id="logo"><rect width="100" height="100" rx="24" fill="#0a0a0d"/><circle cx="50" cy="53" r="27" fill="#fff" opacity=".55" filter="url(#glow)"/><circle cx="50" cy="53" r="27" fill="#fff"/><circle cx="50" cy="49" r="25" fill="#0a0a0d"/></g>
</defs></svg>

<script>
/* ===== time ===== */
const DAY0=new Date(2026,9,25);let nowM=14*60+10;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

function remsOn(k){const r=[];
  for(const e of EV)if(!e.gone&&e.rem&&e.date===k)r.push({time:e.rem,title:e.t,body:`${e.s} 시작(${mins(e.s)-mins(e.rem)}분 전)`,ref:e.id,kind:"ev"});

function taskGroups(k){const live=TASK.filter(t=>!t.gone);

function perTable(ps,k){if(!ps.length)return "";return `<table class="tb"><thead><tr><th>기간명</th><th style="width:120px">기간</th><th style="width:60px">경과</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.t}</td><td class="c">${fd(p.from).replace(/\(.\)/,"")} ~ ${fd(p.to).replace(/\(.\)/,"")}</td><td class="c">${diffDays(p.from,k)+1}/${diffDays(p.from,p.to)+1}일</td></tr>`).join("")}</tbody></table>`}
function ttHTML(k,{H0=7,H1=24,rowH=24}={}){
  const evs=evOn(k),rems=remsOn(k);let h=`<div class="mh0">시</div>${[10,20,30,40,50,60].map(x=>`<div class="mh">${x}</div>`).join("")}`;
  for(let H=H0;H<H1;H++){const A=H*60,B=A+60;
    const segs=evs.filter(e=>mins(e.s)<B&&mins(e.e)>A).map(e=>({e,s:Math.max(mins(e.s),A),en:Math.min(mins(e.e),B),first:mins(e.s)>=A}));
    const ovl=segs.some((x,i)=>segs.some((y,j)=>i<j&&x.s<y.en&&y.s<x.en));
    let r=`<i></i><i></i><i></i><i></i><i></i><i></i>`;
    segs.forEach((g,i)=>{r+=`<div class="bk ${g.e.a} ${g.e.p?"prov":""} ${ovl?(i%2?"half2":"half"):""}" data-ev="${g.e.id}" style="left:${(g.s-A)/60*100}%;width:${(g.en-g.s)/60*100}%" title="${g.e.s}~${g.e.e} ${g.e.t}">${g.first?g.e.t:""}</div>`});
    for(const x of rems){const m=mins(x.time);if(m>=A&&m<B)r+=`<div class="rm" style="left:${(m-A)/60*100}%" title="알림 ${x.time} ${x.title}"></div>`}
    if(k===TODAY&&nowM>=A&&nowM<B)r+=`<div class="now" style="left:${(nowM-A)/60*100}%"></div>`;
    h+=`<div class="h" style="height:${rowH}px">${H}</div><div class="row ${k===TODAY&&B<=nowM?"past":""}" style="height:${rowH}px">${r}</div>`}
  return `<div class="tt">${h}</div>`;
}
function monthHTML(cur,max){
  const f=new Date(cur.getFullYear(),cur.getMonth(),1),s0=add(f,-f.getDay());
  let h=`<table class="cal"><thead><tr>${[...DOW].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`;
  for(let w=0;w<6;w++){h+="<tr>";for(let i=0;i<7;i++){const d=add(s0,w*7+i),k=ymd(d);
    const ps=perOn(k),items=[...evOn(k).map(e=>`<div class="e ${e.p?"prov":""}" data-ev="${e.id}"><span class="t">${e.s}</span> ${e.t}</div>`),...dueOn(k).map(t=>`<div class="e ${t.done?"done":""}" data-ev="${t.id}">${t.done?"■":"□"} ${t.t}</div>`)];
    h+=`<td class="${d.getMonth()!==cur.getMonth()?"out":""} ${k===TODAY?"today":""} ${d.getDay()===0?"sun":""}" data-day="${k}"><span class="n">${d.getDate()}</span>${ps.map(p=>`<div class="pb" title="${p.t}">${p.from===k||d.getDay()===0?p.t:"&nbsp;"}</div>`).join("")}${items.slice(0,max).join("")}${items.length>max?`<div class="more">외 ${items.length-max}건</div>`:""}</td>`}h+="</tr>"}
  return h+"</tbody></table>";
}
function weekTable(days){

function dateWord(t,base){
  for(const[w,v]of Object.entries({"오늘":0,"내일":1,"모레":2,"글피":3}))if(t.includes(w))return{d:add(base,v),m:w};
  let m=t.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){let d=new Date(2026,+m[1]-1,+m[2]);if(d<base)d.setFullYear(2027);return{d,m:m[0]}}
  m=t.match(/(다음\s*주\s*)?(이번\s*주\s*)?([월화수목금토일])요일/);
  if(m){const wd=DOW.indexOf(m[3]);let d=add(base,(wd-base.getDay()+7)%7);if(m[1])d=add(add(base,7-((base.getDay()+6)%7)),(wd+6)%7);else if(+d===+base&&!m[2])d=add(d,7);return{d,m:m[0]}}
  return null}
function timeWord(t){const m=t.match(/(오전|오후|아침|저녁|밤|점심)?\s*(\d{1,2})시\s*(반|(\d{1,2})분)?/);if(!m)return null;let h=+m[2];if(["오후","저녁","밤"].includes(m[1])&&h<12)h+=12;if(!m[1]&&h>=1&&h<=7)h+=12;return{t:hm(h*60+(m[3]==="반"?30:(m[4]?+m[4]:0))),m:m[0]}}
function parse(text){
  const base=new Date(DAY0);let t=text.trim(),subs=[];
  const area=/학교|학년|학생|학부모|교무|교과|수업|담임|상담|시험|생기부|생활기록부|교직원|통신문|체험학습|동아리|협의회|조회|출석부|수행평가|고사|출제|평가|연수|보고서|결재|협의록/.test(text)?"school":"personal";
  let m=t.match(/(\d{1,2})월\s*(\d{1,2})일\s*(?:부터|~|-)\s*(?:(\d{1,2})월\s*)?(\d{1,2})일\s*(?:까지)?/);
  if(m){const from=new Date(2026,+m[1]-1,+m[2]),to=new Date(2026,+(m[3]||m[1])-1,+m[4]);return{kind:"per",t:t.replace(m[0],"").replace(/기간|동안|이야|이에요|입니다/g,"").trim()+" 기간",a:area,from:ymd(from),to:ymd(to)}}
  let rem=null;const rm=t.match(/,?\s*((?:오늘|내일|모레|[월화수목금토일]요일)\s*)?((?:오전|오후|아침|저녁|밤)?\s*\d{1,2}시\s*(?:반|\d{1,2}분)?)에?\s*(알려\s*줘|알림)/);
  if(rm){const dw=rm[1]?dateWord(rm[1],base):null;const tw=timeWord(rm[2]);rem={date:ymd(dw?dw.d:base),time:tw.t};t=t.replace(rm[0],"").trim()}
  if(t.includes(":")){const[a,b]=t.split(":");t=a.trim();subs=b.split(/,|·|\//).map(x=>x.trim()).filter(Boolean)}
  const dw=dateWord(t,base);if(dw)t=t.replace(dw.m,"");
  const tw=timeWord(t);if(tw)t=t.replace(tw.m,"");
  const isTask=subs.length||/까지|제출|내기|사기|주문|하기|신청|납부|입력|정리|인쇄|회수|준비|작성/.test(text)&&!/회의|진료|모임|레슨|수업$/.test(text);
  const title=t.replace(/(에|에서|까지|부터)(\s|$)/g," ").replace(/(일정|스케줄)?\s*(추가|등록|잡아|넣어)\s*(해)?\s*(줘|주세요)?|해야\s*(돼|함)|있어|해줘/g,"").replace(/\s+/g," ").replace(/^[,\s]+|[,\s]+$/g,"").trim()||"메모";
  if(isTask)return{kind:"task",t:title,a:area,due:ymd(dw?dw.d:base),dueT:tw?tw.t:null,rem:rem?[rem]:[],subs:subs.map(x=>({t:x,done:false}))};
  if(!dw&&!tw)return{kind:"missing",t:title};
  const s=tw?tw.t:"09:00",d=dw?dw.d:(mins(s)<nowM?add(base,1):base);
  return{kind:"ev",t:title,a:area,date:ymd(d),s,e:hm(Math.min(mins(s)+60,1439)),rem:rem?rem.time:hm(Math.max(0,mins(s)-30))};
}

function nextAlarm(){ALON=ALQ.shift()||null;const on=!!ALON;
  for(const id of ["dAlarm","pAlarm"]){const el=document.getElementById(id);el.classList.toggle("on",on);el.innerHTML=on?THEME_ALARM(ALON):""}

  if(on){startRing();try{navigator.vibrate&&navigator.vibrate([900,300,900,300,900,300,900,300,900])}catch(e){}}else{stopRing();try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}}
function startRing(){try{ACTX=ACTX||new(window.AudioContext||window.webkitAudioContext)();ACTX.resume&&ACTX.resume()}catch(e){return}
  const beep=()=>{const t0=ACTX.currentTime;[[0,880],[.16,1320],[.32,880],[.48,1320]].forEach(([t,f])=>{const o=ACTX.createOscillator(),g=ACTX.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.3,t0+t+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+t+.14);o.connect(g);g.connect(ACTX.destination);o.start(t0+t);o.stop(t0+t+.15)})};
  beep();clearInterval(RING);RING=setInterval(beep,1300)}

        ${[...G.today,...G.week].slice(0,5).map(t=>`<div class="li ${t.done?"done":""}" style="font-size:12.5px"><span class="mk">${t.done?"■":"□"}</span><span class="tx">${t.t}</span>${dday(t)}</div>`).join("")}</div>
      <div class="card"><div class="ch">이번 주</div>${perLine(w)}<table class="tb" style="font-size:11.5px">${rows(w)}</table></div>
      <div class="card"><div class="ch">다음 주</div>${perLine(wk(add(DAY0,7)))}<table class="tb" style="font-size:11.5px">${rows(wk(add(DAY0,7)))}</table></div>
      <div class="card"><div class="form" style="border-width:1px"><span class="lab">입력</span><input id="wIn" autocomplete="off"><button class="ic" data-demo="voice" title="말하기">${ICON.mic}</button><button class="ic" data-demo="photo" title="사진">${ICON.cam}</button><button class="ic go" data-go="wIn" title="넣기">${ICON.send}</button></div></div>
     </div>${tabs()}`}
  renderLog();
}

/* ===== print ===== */
function printSheet(){
  const c=D.cur,k=ymd(c);let html;
  if(D.view==="month")html=`<div class="dtitle">${c.getFullYear()}년 ${c.getMonth()+1}월 일정</div><div style="height:12px"></div><div style="height:900px">${monthHTML(c,8)}</div>`;
  else if(D.view==="week"){const w=wk(c);html=`<div class="dtitle">주간 업무 계획 (${fd(w[0])} ~ ${fd(w[6])})</div><div style="height:12px"></div>${weekTable(w)}`}
  else{const G=taskGroups(k);
    html=`<div class="dtitle">${fdl(k)} 일일 현황</div><div class="summary">${summary(k)}</div><div style="height:12px"></div>
      <div class="cols"><div>${sec(0,"시간표","10분 단위")}${ttHTML(k,{H0:6,H1:24,rowH:27})}</div><div>
        ${sec(1,"할 일")}<div class="grp">가. 오늘까지</div>${G.today.map(t=>taskHTML(t,{subAdd:false})).join("")}<div class="grp">나. 7일 안 마감</div>${G.week.map(t=>taskHTML(t,{subAdd:false})).join("")}
        <div style="height:12px"></div>${sec(2,"일정")}${evTable(evOn(k),{act:false})}
        <div style="height:12px"></div>${sec(3,"메모")}${Array.from({length:6},()=>`<div class="line"></div>`).join("")}
      </div></div><div class="foot">- 1 -</div>`}
  document.getElementById("sheet").innerHTML=html;document.getElementById("printModal").classList.add("on");
}

/* ===== glue ===== */
function renderAll(){renderDesk();renderPhone();renderLog();document.getElementById("clockLbl").textContent=`10. 25.(일) ${hm(nowM)}`}
document.addEventListener("click",ev=>{const t=ev.target,q=s=>t.closest(s);
  if(q("[data-alarm]")){alarmAct(q("[data-alarm]").dataset.alarm);return}
  if(q("[data-drag]"))return;
  if(q("[data-close]")){const card=q(".nt"),ref=card&&card.dataset.nref;
    if(q("[data-tdone]"))byId(+q("[data-tdone]").dataset.tdone).done=true;
    if(q("[data-snooze]")){const x=byId(+q("[data-snooze]").dataset.snooze),at=hm(nowM+10);if(Array.isArray(x.rem))x.rem.push({date:TODAY,time:at});else x.rem=at}
    document.querySelectorAll(`.nt[data-nref="${ref}"]`).forEach(n=>n.remove());renderAll();return}
  if(q("[data-adv]")){const a=q("[data-adv]").dataset.adv;advance(a==="to1500"?900:a==="to1630"?990:nowM+(+a));return}
  if(q("[data-ok]")){byId(+q("[data-ok]").dataset.ok).p=false;renderAll();return}
  if(q("[data-no]")){const e=byId(+q("[data-no]").dataset.no);e.gone=true;e.p=false;LOG.push({t:"취소",msg:e.t,fresh:true});renderAll();return}
  if(q("[data-tdone]")){const x=byId(+q("[data-tdone]").dataset.tdone);x.done=!x.done;if(x.done)x.subs.forEach(s=>s.done=true);renderAll();return}
  if(q("[data-sub]")){const[id,i]=q("[data-sub]").dataset.sub.split(":");const x=byId(+id);x.subs[+i].done=!x.subs[+i].done;x.done=x.subs.every(s=>s.done);renderAll();return}
  if(q("[data-demo]")){demo(q("[data-demo]").dataset.demo);return}
  if(q("[data-go]")){const id=q("[data-go]").dataset.go;submit(id,srcOf(id));return}
  if(q("[data-tab]")){P.tab=q("[data-tab]").dataset.tab;renderPhone();return}
  if(q("#printBtn")){printSheet();return}
  if(q("#closePrint")){document.getElementById("printModal").classList.remove("on");return}
  if(q(".subadd")||q("input"))return;
  if(q("#win")){
    if(q("[data-v]")){D.view=q("[data-v]").dataset.v;renderDesk();return}
    if(q("[data-nav]")){const n=+q("[data-nav]").dataset.nav;if(!n)D.cur=new Date(DAY0);else if(D.view==="month")D.cur=new Date(D.cur.getFullYear(),D.cur.getMonth()+n,1);else D.cur=add(D.cur,n*(D.view==="week"?7:1));renderDesk();return}
    const dd=q("[data-day]");if(dd&&D.view!=="day"){D.cur=pd(dd.dataset.day);D.view="day";renderDesk();return}
    const e=q("[data-ev]");if(e&&D.view!=="day"){const x=byId(+e.dataset.ev);D.cur=pd(x.date||x.due);D.view="day";renderDesk();return}
  }
  if(q("#phone")){
    if(q("[data-pn]")){const n=+q("[data-pn]").dataset.pn;P.cur=n?add(P.cur,n):new Date(DAY0);renderPhone();return}
    if(q("[data-pm]")){const n=+q("[data-pm]").dataset.pm;P.cur=new Date(P.cur.getFullYear(),P.cur.getMonth()+n,1);renderPhone();return}
    const dd=q("[data-day]");if(dd&&P.tab==="cal"){P.cur=pd(dd.dataset.day);P.tab="today";renderPhone();return}
  }
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const el=e.target;
  if(el.dataset&&el.dataset.subadd){const v=el.value.trim();if(!v)return;const x=byId(+el.dataset.subadd);x.subs.push({t:v,done:false});x.done=false;renderAll();const again=document.querySelector(`[data-subadd="${x.id}"]`);if(again)again.focus();return}
  const id=el.id;if(id==="dChatIn"||id==="pChatIn"){submit(id,srcOf(id));return}if(id==="dIn")submit("dIn","데스크톱");if(id==="pIn")submit("pIn","휴대폰");if(id==="lockIn")submit("lockIn","잠금화면");if(id==="wIn")submit("wIn","홈 위젯")});
document.getElementById("devSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#devSeg .btn").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("win").style.display=b.dataset.dev==="phone"?"none":"";document.getElementById("phone").style.display=b.dataset.dev==="desk"?"none":""};
document.getElementById("dComp").innerHTML=bar("dIn","dLast");document.getElementById("dChat").innerHTML=sheetHTML("d");document.getElementById("pChat").innerHTML=sheetHTML("p");
renderAll();
</script>
</body>
</html>
