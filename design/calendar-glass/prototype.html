<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블랙홀 시안</title>
<style>
:root{
  --font:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  --ink:#f4f5fb;--ink2:rgba(244,245,251,.68);--ink3:rgba(244,245,251,.42);
  --glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--line:rgba(255,255,255,.16);--hair:rgba(255,255,255,.08);
  --school:#5ec8ff;--personal:#ff8fcf;--todo:#ffd36e;--note:#a9e77a;--now:#ff5d7a;
  --page:#0b0c14;--wall:radial-gradient(900px 600px at 0% 0%,#2a2366 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#0e4a5e 0%,transparent 60%),#0d0f1c;
  --tday:#fff;--tdayink:#111;
}
:root[data-theme="light"]{
  --ink:#16172a;--ink2:rgba(22,23,42,.66);--ink3:rgba(22,23,42,.4);
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--line:rgba(22,23,42,.1);--hair:rgba(22,23,42,.07);
  --school:#1689c9;--personal:#c9479a;--todo:#b98000;--note:#3f8a12;--now:#e0304f;
  --page:#e8eaf3;--wall:radial-gradient(900px 600px at 0% 0%,#dcd6ff 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#cdeff7 0%,transparent 60%),#f1f2f8;
  --tday:#16172a;--tdayink:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.g{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px}
.ctl .name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-right:auto}
.ctl .name svg{width:26px;height:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;color:var(--ink2);font-size:12.5px}
.seg button.on{background:var(--glass2);color:var(--ink);font-weight:700}
.demo{font-size:12px;color:var(--ink2)}
.demo button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--ink2);margin-left:2px}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:4px 20px 30px;flex-wrap:wrap}
.win{width:1180px;height:740px;border-radius:14px;overflow:hidden;background:var(--wall);box-shadow:0 24px 70px rgba(0,0,0,.35);display:grid;grid-template-rows:30px auto 1fr auto;flex:none}
.chrome{display:flex;align-items:center;gap:7px;padding:0 12px}
.chrome i{width:11px;height:11px;border-radius:50%}
.bar{display:flex;align-items:center;gap:6px;padding:4px 12px 8px}
.bar .title{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-right:6px;min-width:150px}
.nb{border:1px solid var(--line);background:var(--glass);border-radius:7px;padding:3px 9px;font-size:12.5px}
.sp{flex:1}
.content{min-height:0;padding:0 12px;overflow:hidden}
.composer{padding:6px 12px 10px}
.log{display:flex;flex-direction:column;gap:2px;margin-bottom:5px;max-height:66px;overflow:auto}
.lg{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.lg b{color:var(--ink);font-weight:700}
.lg .src{color:var(--ink3);font-size:11px}
.lg a{color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:11.5px}
.lg.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(255,255,255,.18)}100%{background:transparent}}
.inp{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 4px 4px 12px}
.inp input{flex:1;background:none;border:0;outline:0;font-size:14px;padding:7px 0;min-width:0}
.inp input::placeholder{color:var(--ink3)}
.inp button{border:0;border-radius:9px;padding:7px 11px;font-size:12.5px;background:var(--glass2)}
.inp button.go{background:#6d55f0;color:#fff;font-weight:700}
.c{display:block;font-size:11px;line-height:15px;padding:0 4px;border-radius:4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.c.school{background:color-mix(in srgb,var(--school) 24%,transparent)}
.c.personal{background:color-mix(in srgb,var(--personal) 24%,transparent)}
.c.todo{background:none;color:var(--ink2);padding-left:2px}
.c.prov{outline:1px dashed var(--ink3);outline-offset:-1px}
.c.done{text-decoration:line-through;opacity:.5}
.ga{font-size:9px;font-weight:800;padding:0 3px;border-radius:3px;background:var(--ink);color:var(--page);margin-left:3px;vertical-align:1px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d-school{background:var(--school)}.d-personal{background:var(--personal)}.d-todo{background:var(--todo)}.d-note{background:var(--note)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:20px repeat(6,minmax(0,1fr));height:100%;border-radius:10px;overflow:hidden}
.month .dw{font-size:11px;color:var(--ink2);padding:2px 5px}
.month .cell{border-top:1px solid var(--hair);border-left:1px solid var(--hair);padding:2px 3px;overflow:hidden;cursor:pointer;min-height:0}
.month .cell:nth-child(7n+1){border-left:0}
.month .cell.out{opacity:.35}
.month .n{font-size:11.5px;font-weight:700;padding:0 4px;border-radius:5px}
.month .cell.today .n{background:var(--tday);color:var(--tdayink)}
.month .sun .n{color:#ff7d8f}.month .cell.today.sun .n{color:var(--tdayink)}
.month .more{font-size:10px;color:var(--ink3);padding-left:3px}
.week{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));height:100%;overflow:auto;border-radius:10px}
.week .hd{font-size:11.5px;text-align:center;padding:3px 0;color:var(--ink2);cursor:pointer;position:sticky;top:0;background:var(--page);z-index:2}
.week .hd.today b{background:var(--tday);color:var(--tdayink);border-radius:5px;padding:0 5px}
.week .hl{font-size:10px;color:var(--ink3);text-align:right;padding-right:4px}
.week .col{position:relative;border-left:1px solid var(--hair)}
.week .td{border-left:1px solid var(--hair);padding:1px 2px;border-bottom:1px solid var(--hair)}
.wb{position:absolute;left:2px;right:2px;border-radius:4px;font-size:10.5px;line-height:13px;padding:1px 4px;overflow:hidden;cursor:pointer}
.wb.school{background:color-mix(in srgb,var(--school) 34%,transparent)}
.wb.personal{background:color-mix(in srgb,var(--personal) 34%,transparent)}
.wb.prov{outline:1px dashed var(--ink2);outline-offset:-1px}
.tt{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass)}
.tt .h{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.tt .row{grid-column:2 / span 6;position:relative;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr)}
.tt .row i{border-left:1px solid var(--line)}
.tt .row i:first-child{border-left:0}
.tt .row i:nth-child(4){border-left:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.tt .mh{font-size:9.5px;color:var(--ink3);text-align:right;padding:2px 3px 1px;border-bottom:1px solid var(--line)}
.tt .mh0{border-bottom:1px solid var(--line)}

.tt .bk{position:absolute;top:1px;bottom:1px;border-radius:3px;font-size:10.5px;line-height:1.15;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center}
.tt .bk.school{background:color-mix(in srgb,var(--school) 45%,transparent)}
.tt .bk.personal{background:color-mix(in srgb,var(--personal) 45%,transparent)}
.tt .bk.prov{outline:1px dashed var(--ink);outline-offset:-1px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.tt .bk.half{bottom:50%}.tt .bk.half2{top:50%}
.tt .now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:3}
.tt .row.past{opacity:.55}
.day{display:grid;grid-template-columns:460px minmax(0,1fr);gap:10px;height:100%;min-height:0}
.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0;align-content:start}
.side .box{overflow:auto;min-height:0}
.box{border-radius:10px;padding:6px 9px}
.box h4{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:4px}
.box h4 small{font-weight:400;color:var(--ink2)}
.ck{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:13px;cursor:pointer;border-top:1px solid var(--hair)}
.ck:first-of-type{border-top:0}
.ck .bx{width:14px;height:14px;border:1.5px solid var(--ink2);border-radius:4px;flex:none;display:grid;place-items:center;font-size:11px;line-height:1}
.ck.done .bx{background:var(--note);border-color:var(--note);color:#0d1a05}
.ck.done .t{text-decoration:line-through;color:var(--ink3)}
.ck .m{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.ev{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:13px;border-top:1px solid var(--hair);cursor:pointer}
.ev:first-of-type{border-top:0}
.ev .tm{width:74px;color:var(--ink2);font-size:11.5px;flex:none}
.ev .act{margin-left:auto;display:flex;gap:4px}
.mini{font-size:11px;border:1px solid var(--line);background:var(--glass2);border-radius:6px;padding:1px 7px}
.inb{display:flex;gap:7px;font-size:12px;padding:2px 0;border-top:1px solid var(--hair);white-space:nowrap;overflow:hidden}
.inb:first-of-type{border-top:0}
.inb .tm{color:var(--ink3);width:36px;flex:none}
.inb .s{color:var(--ink3);font-size:11px}
.st{font-size:10.5px;margin-left:4px}.st.ok{color:var(--note)}.st.run{color:var(--school)}.st.warn{color:var(--todo)}
.phone{width:380px;height:820px;border-radius:50px;padding:11px;background:#08080b;box-shadow:0 24px 70px rgba(0,0,0,.45);flex:none}
.scr{width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--wall);display:flex;flex-direction:column;position:relative}
.sb{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700}
.isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#000;z-index:4}
.ph{flex:1;min-height:0;display:flex;flex-direction:column}
.phbar{display:flex;align-items:center;gap:6px;padding:2px 12px 6px}
.phbar .title{font-size:18px;font-weight:800;flex:1}
.phbody{flex:1;overflow:auto;padding:0 10px 6px;min-height:0}
.phone .tt{grid-template-columns:24px repeat(6,minmax(0,1fr))}
.phone .tt .h{font-size:10px}
.phone .month .c{font-size:9px;line-height:12px;padding:0 2px}
.phone .month .n{font-size:10.5px}
.phone .composer{padding:4px 10px 4px}
.phone .inp input{font-size:13.5px}
.tabs{display:flex;justify-content:space-around;padding:4px 8px 16px;flex:none;border-top:1px solid var(--hair)}
.tabs button{background:none;border:0;font-size:12.5px;color:var(--ink3);padding:6px 8px;font-weight:700}
.tabs button.on{color:var(--ink)}
.toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:rgba(15,15,25,.9);color:#fff;font-size:12px;padding:7px 12px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.show{opacity:1}
.lock{flex:1;display:flex;flex-direction:column;padding:0 14px 12px;gap:8px;background:radial-gradient(260px 300px at 25% 25%,rgba(255,170,110,.45),transparent 70%),radial-gradient(300px 300px at 85% 70%,rgba(110,190,255,.45),transparent 70%),linear-gradient(#1a1d3a,#33203f)}
.lock .date{text-align:center;font-size:14px;font-weight:600;color:#fff}
.lock .clock{text-align:center;font-size:76px;font-weight:300;letter-spacing:-3px;line-height:.95;color:#fff}
.lp{border-radius:18px;padding:10px 12px;background:rgba(10,10,20,.32);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff}
.lp h5{font-size:12px;font-weight:800;margin-bottom:3px;display:flex;justify-content:space-between;color:#fff}
.lp h5 small{font-weight:400;opacity:.7}
.lr{display:flex;gap:9px;align-items:center;font-size:15px;padding:3px 0}
.lr .tm{width:44px;font-size:13px;opacity:.75;flex:none}
.lr.past{opacity:.45}
.lr .dot{width:8px;height:8px}
.lck{display:flex;gap:8px;align-items:center;font-size:14px;padding:2px 0;cursor:pointer}
.lck .bx{width:15px;height:15px;border:1.5px solid rgba(255,255,255,.8);border-radius:4px;flex:none;font-size:10px;display:grid;place-items:center}
.lck.done{opacity:.45;text-decoration:line-through}
.ln{border-radius:16px;padding:8px 10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff}
.ln .row{display:flex;gap:6px;align-items:center}
.ln input{flex:1;min-width:0;border:0;outline:0;background:rgba(255,255,255,.18);border-radius:9px;padding:7px 9px;color:#fff;font-size:13px}
.ln input::placeholder{color:rgba(255,255,255,.65)}
.ln button{border:0;border-radius:9px;padding:7px 9px;font-size:12px;background:rgba(255,255,255,.25);color:#fff}
.ln .pend{font-size:12px;margin-top:6px;display:flex;gap:6px;align-items:center}
.home{flex:1;padding:4px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto;background:linear-gradient(160deg,#3a2f7a,#14506a 55%,#6a2a58)}
.wg{border-radius:22px;padding:12px 14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:#fff}
.wg h5{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.wg h5 small{font-weight:400;opacity:.7}
.wg .lr{font-size:13.5px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 4px}
.apps span{aspect-ratio:1;border-radius:15px;background:rgba(255,255,255,.18)}
.apps svg{border-radius:15px;display:block;width:100%;height:auto}
.w2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.wline{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:1.5px 0;white-space:nowrap;overflow:hidden}
.wline .tm{width:40px;opacity:.75;font-size:11.5px;flex:none}
.wline.past{opacity:.45}
.wg .lck{font-size:12.5px;padding:1.5px 0;white-space:nowrap;overflow:hidden}
.wg .lck .bx{width:13px;height:13px}
.wr{display:flex;gap:8px;font-size:11.5px;padding:2px 0;border-top:1px solid rgba(255,255,255,.15)}
.wr:first-of-type{border-top:0}
.wr.on{font-weight:700}
.wr .wd{width:34px;flex:none;opacity:.8}
.wr .wl{display:flex;flex-wrap:wrap;gap:2px 9px;min-width:0}
.wi{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.wi .dot{width:5px;height:5px}
.mm{display:grid;grid-template-columns:repeat(7,1fr);font-size:9.5px;text-align:center;gap:1px 0}
.mm .mmt{grid-column:1/-1;text-align:left;font-weight:800;font-size:11.5px;margin-bottom:2px}
.mm b{font-weight:600;opacity:.6}
.mm span{position:relative;padding:1px 0 3px}
.mm span.o{opacity:.3}.mm span.t{background:#fff;color:#111;border-radius:5px;font-weight:800}
.mm i{position:absolute;left:50%;bottom:0;width:3px;height:3px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.mm span.t i{background:#111}
.cap{font-size:10.5px;text-align:center;color:rgba(255,255,255,.7);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:50}
.modal.on{display:flex}
.sheet{width:794px;min-height:1123px;background:#fff;color:#111;padding:40px 44px;font-family:var(--font);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sheet h1{font-size:22px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:12px}
.sheet h1 small{font-size:12px;font-weight:400;color:#555}
.sheet .cols{display:grid;grid-template-columns:400px 1fr;gap:22px}
.sheet .ptt{display:grid;grid-template-columns:28px repeat(6,1fr);border:1px solid #111}
.sheet .ptt .h{font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border-top:1px solid #bbb;height:30px}
.sheet .ptt .row{grid-column:2 / span 6;position:relative;border-top:1px solid #bbb;display:grid;grid-template-columns:repeat(6,1fr);height:30px}
.sheet .ptt .row i{border-left:1px dotted #bbb}.sheet .ptt .row i:nth-child(4){border-left:1px solid #888}
.sheet .ptt .first{border-top:0}
.sheet .ptt .bk{position:absolute;top:2px;bottom:2px;background:#e4e4e4;border:1px solid #777;border-radius:2px;font-size:10px;padding:0 3px;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.sheet h3{font-size:13px;margin:0 0 6px;border-bottom:1px solid #111;padding-bottom:3px}
.sheet .pck{display:flex;gap:8px;align-items:center;font-size:13px;height:30px;border-bottom:1px solid #ddd}
.sheet .pck .bx{width:14px;height:14px;border:1.5px solid #111;flex:none}
.sheet .line{height:30px;border-bottom:1px solid #ddd}
.sheet .pmonth{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #111}
.sheet .pmonth div{border:1px solid #ccc;min-height:150px;padding:3px;font-size:10px}
.sheet .pmonth .dw{min-height:auto;font-weight:700;text-align:center}
.sheet .pmonth b{font-size:11px}
.mbar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printModal){display:none!important}
  #printModal{position:static;display:block;background:none;padding:0}
  .mbar{display:none}
  .sheet{box-shadow:none;width:auto;min-height:auto}
}
@media (max-width:1250px){.win{zoom:.8}}
</style>
</head>
<body>
<div class="ctl">
  <div class="name"><svg viewBox="0 0 100 100"><use href="#logo"/></svg>블랙홀 <span style="font-weight:400;font-size:12px;color:var(--ink2)">시안 · 가짜 일정 · 오늘 10월 25일(일) 오후 2:10</span></div>
  <span class="demo">시연:<button data-demo="photo">공문 사진</button><button data-demo="voice">음성</button><button data-demo="discord">디스코드</button><button data-demo="note">기억해 줘</button></span>
  <div class="seg" id="devSeg"><button data-dev="both" class="on">둘 다</button><button data-dev="desk">데스크톱</button><button data-dev="phone">휴대폰</button></div>
  <div class="seg" id="thSeg"><button data-th="dark" class="on">어둡게</button><button data-th="light">밝게</button></div>
</div>

<div class="stage">
  <div class="win" id="win">
    <div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="bar">
      <div class="title" id="dTitle"></div>
      <button class="nb" data-nav="-1">‹</button><button class="nb" data-nav="1">›</button><button class="nb" data-nav="0">오늘</button>
      <span class="sp"></span>
      <div class="seg" id="dView"><button data-v="month">월</button><button data-v="week">주</button><button data-v="day" class="on">일</button></div>
      <button class="nb" id="printBtn">출력</button>
    </div>
    <div class="content" id="dMain"></div>
    <div class="composer">
      <div class="log" id="dLog"></div>
      <div class="inp g"><input id="dIn" placeholder="던져 넣기 — 예: 목요일 3시 학부모 상담 / 금요일까지 생기부 입력 / 파일을 끌어다 놓기"><button data-demo="photo">파일</button><button data-demo="voice">음성</button><button class="go" id="dGo">넣기</button></div>
    </div>
  </div>

  <div class="phone" id="phone">
    <div class="scr">

function parse(text){
  let t=text.trim(),date=null,s=null,a="personal",kind="event";const base=new Date(NOW);base.setHours(0,0,0,0);
  for(const[w,v]of Object.entries({"오늘":0,"내일":1,"모레":2,"글피":3}))if(t.includes(w)){date=add(base,v);t=t.replace(w,"")}
  let m=t.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){date=new Date(2026,+m[1]-1,+m[2]);if(date<base)date.setFullYear(2027);t=t.replace(m[0],"")}
  m=t.match(/(다음\s*주\s*)?(이번\s*주\s*)?([월화수목금토일])요일/);
  if(m){const wd=DOW.indexOf(m[3]);let d=add(base,(wd-base.getDay()+7)%7);if(m[1])d=add(add(base,7-((base.getDay()+6)%7)),(wd+6)%7);else if(+d===+base&&!m[2])d=add(d,7);date=d;t=t.replace(m[0],"")}
  m=t.match(/(오전|오후|아침|저녁|밤|점심)?\s*(\d{1,2})시\s*(반|(\d{1,2})분)?/);
  if(m){let h=+m[2];if(["오후","저녁","밤"].includes(m[1])&&h<12)h+=12;if(!m[1]&&h>=1&&h<=7)h+=12;const mm=m[3]==="반"?30:(m[4]?+m[4]:0);s=`${pad(h)}:${pad(mm)}`;t=t.replace(m[0],"");if(!date){date=new Date(base);if(h*60+mm<nowM)date=add(date,1)}}
  if(/기억해|알아둬|메모해/.test(text)&&!s&&!date)kind="note";
  else if(/제출|내기|사기|주문|하기|보내기|신청|납부|입력|까지|정리|인쇄/.test(text)&&!/회의|상담|진료|모임|수업|레슨/.test(text))kind="todo";
  if(/학교|학년|학생|학부모|교무|교과|수업|담임|상담|시험|생활기록부|생기부|반 |교직원|가정통신문|체험학습|동아리|협의회|조회|출석부/.test(text))a="school";
  let title=t.replace(/(에|에서|까지|부터)(\s|$)/g," ").replace(/(일정|스케줄)?\s*(추가|등록|잡아|넣어)\s*(해)?\s*(줘|주세요)?|기억해\s*(줘|둬)?|있어|해야\s*돼|해줘/g,"").replace(/는 거|라는 거|다는 거/g,"").replace(/\s+/g," ").trim();
  if(!title)title="메모";
  if(kind==="note")return{t:title,a:"note"};
  if(kind==="todo")return{t:title,a:"todo",area:a,date:ymd(date||base)};
  if(!date)return{t:title,a,missing:true};
  const en=s?mins(s)+60:0;
  return{t:title,a,date:ymd(date),s,e:s?`${pad(Math.floor(en/60)%24)}:${pad(en%60)}`:null};
}
function ingest(src,results){

}

function submit(id,src){const el=document.getElementById(id);const v=el.value.trim();if(!v)return;el.value="";ingest(src,v.split(/\s*(?:그리고|,)\s*/).filter(Boolean).map(parse))}

const P={tab:"today",cur:new Date(NOW)};
function composer(id){return `<div class="composer"><div class="log" id="pLog" style="max-height:44px"></div><div class="inp g"><input id="${id}" placeholder="던져 넣기"><button data-demo="photo">사진</button><button data-demo="voice">음성</button><button class="go" data-go="${id}">넣기</button></div></div>`}
function tabs(){return `<div class="tabs">${[["today","오늘"],["cal","달력"],["lock","잠금화면"],["home","홈 위젯"]].map(([k,l])=>`<button data-tab="${k}" class="${P.tab===k?"on":""}">${l}</button>`).join("")}</div>`}
function renderPhone(){
  const v=document.getElementById("pMain"),c=P.cur,k=ymd(c);
  if(P.tab==="today"){const td=todos(k);
    v.innerHTML=`<div class="phbar"><div class="title">${c.getMonth()+1}월 ${c.getDate()}일 ${DOW[c.getDay()]}</div><button class="nb" data-pn="-1">‹</button><button class="nb" data-pn="1">›</button><button class="nb" data-pn="0">오늘</button></div>
     <div class="phbody"><div class="box g" style="margin-bottom:8px"><h4>할 일 <small>${td.filter(e=>e.st==="done").length}/${td.length}</small></h4>${td.map(e=>ckHTML(e)).join("")||'<div style="color:var(--ink3)">없음</div>'}</div>${ttHTML(k,{H0:7,H1:24,rowH:24})}</div>${composer("pIn")}${tabs()}`}
  if(P.tab==="cal"){
    v.innerHTML=`<div class="phbar"><div class="title">${c.getFullYear()}년 ${c.getMonth()+1}월</div><button class="nb" data-pm="-1">‹</button><button class="nb" data-pm="1">›</button></div>
     <div class="phbody" style="display:flex;flex-direction:column">${monthHTML(c,4)}</div>${composer("pIn")}${tabs()}`}
  if(P.tab==="lock"){const tl=timed(TODAY),td=todos(TODAY),tom=timed(ymd(add(NOW,1)));
    v.innerHTML=`<div class="lock">
      <div class="date">10월 25일 일요일</div><div class="clock">2:10</div>
      <div class="lp"><h5>오늘 일정 <small>${tl.length}개</small></h5>${tl.map(e=>`<div class="lr ${mins(e.e)<=nowM?"past":""}"><span class="tm">${e.s}</span><span class="dot d-${e.a}"></span><span>${e.t}</span>${e.p?'<span class="ga" style="background:#fff;color:#111">가</span>':""}</div>`).join("")}</div>
      <div class="lp"><h5>할 일 <small>${td.filter(e=>e.st==="done").length}/${td.length}</small></h5>${td.map(e=>`<div class="lck ${e.st==="done"?"done":""}" data-chk="${e.id}"><span class="bx">${e.st==="done"?"✓":""}</span>${e.t}</div>`).join("")}</div>
      <div class="lp" style="padding:7px 12px"><h5 style="margin:0">내일 <small>${tom.map(e=>e.s+" "+e.t).join(" · ")}</small></h5></div>
      <div class="ln" style="margin-top:auto"><div class="row"><input id="lockIn" placeholder="잠금 상태에서 던지기"><button data-lock="voice">말하기</button><button data-lock="photo">사진</button><button data-go="lockIn" style="background:#6d55f0">넣기</button></div>
        ${pending().length?`<div class="pend">확인 대기 ${pending().length}건 <button data-okall="1" style="padding:3px 8px">모두 확정</button></div>`:""}</div>
      <div class="cap">잠금화면 = 달력이 그려진 배경화면(자동 갱신) + 항상 떠 있는 입력 알림</div>
     </div>${tabs()}`}
  if(P.tab==="home"){const tl=timed(TODAY),td=todos(TODAY),w=wk(NOW),soon=EV.filter(e=>e.a==="todo"&&!e.gone&&e.st!=="done"&&e.date>TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
    const wrow=x=>{const d=pd(x),l=of(x);return `<div class="wr ${x===TODAY?"on":""}"><span class="wd">${DOW[d.getDay()]} ${d.getDate()}</span><span class="wl">${l.map(e=>`<span class="wi"><span class="dot d-${e.area||e.a}"></span>${e.s?e.s.replace(/^0/,"")+" ":"☐"}${e.t}</span>`).join("")||'<span style="opacity:.45">—</span>'}</span></div>`};
    v.innerHTML=`<div class="home">
      <div class="wg"><h5>오늘 <small>10월 25일 일 · 확인 대기 ${pending().length}</small></h5>
        <div class="w2"><div>${tl.map(e=>`<div class="wline ${mins(e.e)<=nowM?"past":""}"><span class="tm">${e.s}</span><span class="dot d-${e.a}"></span>${e.t}${e.p?'<span class="ga" style="background:#fff;color:#111">가</span>':""}</div>`).join("")}</div>
        <div>${td.map(e=>`<div class="lck ${e.st==="done"?"done":""}" data-chk="${e.id}"><span class="bx">${e.st==="done"?"✓":""}</span>${e.t}</div>`).join("")}</div></div></div>
      <div class="wg"><h5>이번 주</h5>${w.map(wrow).join("")}</div>
      <div class="wg"><h5>다음 주</h5>${wk(add(NOW,7)).map(wrow).join("")}</div>
      <div class="w2" style="gap:10px">
        <div class="wg" style="padding:10px"><h5>마감</h5>${soon.map(e=>`<div class="wline"><span class="tm" style="width:38px">${fd(e.date).replace(/\(.\)/,"")}</span>${e.t}</div>`).join("")}</div>
        <div class="wg" style="padding:8px">${miniMonth(NOW)}</div>
      </div>
      <div class="wg" style="padding:8px 10px"><div class="ln" style="background:none;border:0;padding:0"><div class="row"><input id="wIn" placeholder="블랙홀에 던지기"><button data-lock="voice">말하기</button><button data-lock="photo">사진</button><button data-go="wIn" style="background:#6d55f0">넣기</button></div></div></div>
     </div>${tabs()}`}
  renderLog();
}

function printSheet(){
  const c=D.cur,k=ymd(c);let html;
  if(D.view==="month"){const f=new Date(c.getFullYear(),c.getMonth(),1),st=add(f,-f.getDay());
    html=`<h1>${c.getFullYear()}년 ${c.getMonth()+1}월 <small>블랙홀</small></h1><div class="pmonth">${[...DOW].map(x=>`<div class="dw">${x}</div>`).join("")}${Array.from({length:42},(_,i)=>{const d=add(st,i),x=ymd(d);return `<div style="${d.getMonth()!==c.getMonth()?"color:#aaa":""}"><b>${d.getDate()}</b>${of(x).map(e=>`<div>${e.a==="todo"?"☐ ":(e.s||"")+" "}${e.t}</div>`).join("")}</div>`}).join("")}</div>`}
  else{const td=todos(k);let rows="";
    for(let H=6;H<24;H++){const A=H*60,B=A+60;let r=`<i></i><i></i><i></i><i></i><i></i><i></i>`;
      for(const e of timed(k)){if(mins(e.s)<B&&mins(e.e)>A){const s=Math.max(mins(e.s),A),en=Math.min(mins(e.e),B);r+=`<div class="bk" style="left:${(s-A)/60*100}%;width:${(en-s)/60*100}%">${mins(e.s)>=A?e.t:""}</div>`}}
      rows+=`<div class="h ${H===6?"first":""}">${H}</div><div class="row ${H===6?"first":""}">${r}</div>`}
    html=`<h1>${c.getFullYear()}. ${c.getMonth()+1}. ${c.getDate()}. (${DOW[c.getDay()]}) <small>블랙홀 · 하루 플래너</small></h1>
      <div class="cols"><div class="ptt">${rows}</div><div>
        <h3>할 일</h3>${td.map(e=>`<div class="pck"><span class="bx" style="text-align:center;font-size:11px;line-height:12px">${e.st==="done"?"✓":""}</span>${e.t}</div>`).join("")}${Array.from({length:Math.max(3,9-td.length)},()=>`<div class="pck"><span class="bx"></span></div>`).join("")}
        <h3 style="margin-top:18px">일정</h3>${timed(k).map(e=>`<div class="pck">${e.s}–${e.e} ${e.t}</div>`).join("")}
        <h3 style="margin-top:18px">메모</h3>${Array.from({length:8},()=>`<div class="line"></div>`).join("")}
      </div></div>`}
  document.getElementById("sheet").innerHTML=html;document.getElementById("printModal").classList.add("on");
}

function renderAll(){renderDesk();renderPhone();renderLog()}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1300)}
document.addEventListener("click",ev=>{const t=ev.target;
  const q=s=>t.closest(s);
  if(q("[data-ok]")){byId(+q("[data-ok]").dataset.ok).p=false;renderAll();return}
  if(q("[data-no]")){const e=byId(+q("[data-no]").dataset.no);e.gone=true;e.p=false;LOG.push({t:"취소",msg:e.t,src:"",fresh:true});renderAll();return}
  if(q("[data-okall]")){pending().forEach(e=>e.p=false);renderAll();return}
  if(q("[data-chk]")){const e=byId(+q("[data-chk]").dataset.chk);e.st=e.st==="done"?"todo":"done";renderAll();return}
  if(q("[data-demo]")){demo(q("[data-demo]").dataset.demo);return}
  if(q("[data-lock]")){const k=q("[data-lock]").dataset.lock;if(k==="voice")ingest("잠금화면 음성",[parse("내일 아침에 출석부 정리하기")]);else demo("photo");return}
  if(q("[data-go]")){const id=q("[data-go]").dataset.go;submit(id,id==="lockIn"?"잠금화면":id==="wIn"?"홈 위젯":"휴대폰");return}
  if(q("[data-tab]")){P.tab=q("[data-tab]").dataset.tab;renderPhone();return}
  if(q("#printBtn")){printSheet();return}
  if(q("#closePrint")){document.getElementById("printModal").classList.remove("on");return}
  if(q("#win")){
    if(q("[data-v]")){D.view=q("[data-v]").dataset.v;renderDesk();return}
    if(q("[data-nav]")){const n=+q("[data-nav]").dataset.nav;if(!n)D.cur=new Date(NOW);else if(D.view==="month")D.cur=new Date(D.cur.getFullYear(),D.cur.getMonth()+n,1);else D.cur=add(D.cur,n*(D.view==="week"?7:1));renderDesk();return}
    const day=q("[data-day]")||(q("[data-ev]")&&D.view!=="day"?{dataset:{day:byId(+q("[data-ev]").dataset.ev).date}}:null);
    if(day){D.cur=pd(day.dataset.day);D.view="day";renderDesk();return}
  }
  if(q("#phone")){
    if(q("[data-pn]")){const n=+q("[data-pn]").dataset.pn;P.cur=n?add(P.cur,n):new Date(NOW);renderPhone();return}
    if(q("[data-pm]")){const n=+q("[data-pm]").dataset.pm;P.cur=new Date(P.cur.getFullYear(),P.cur.getMonth()+n,1);renderPhone();return}
    const day=q("[data-day]");if(day&&P.tab==="cal"){P.cur=pd(day.dataset.day);P.tab="today";renderPhone();return}
  }
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const id=e.target.id;if(id==="dIn")submit("dIn","데스크톱");if(id==="pIn")submit("pIn","휴대폰");if(id==="lockIn")submit("lockIn","잠금화면");if(id==="wIn")submit("wIn","홈 위젯")});
document.getElementById("dGo").onclick=()=>submit("dIn","데스크톱");
document.getElementById("devSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#devSeg button").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("win").style.display=b.dataset.dev==="phone"?"none":"";document.getElementById("phone").style.display=b.dataset.dev==="desk"?"none":""};
document.getElementById("thSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#thSeg button").forEach(x=>x.classList.toggle("on",x===b));document.documentElement.dataset.theme=b.dataset.th};
renderAll();
</script>
</body>
</html>
