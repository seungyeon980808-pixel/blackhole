name: Windows desktop

on:
  push:
    branches: ["desktop/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Test frontend
        working-directory: desktop
        run: npm test
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Prepare reproducible Rust dependency lock
        shell: pwsh
        run: if (-not (Test-Path desktop/src-tauri/Cargo.lock)) { cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml }
      - name: Test native modules
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build Windows installers
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis,msi
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-desktop-windows-0.2.0
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/msi/**/*.msi
